openapi: 3.0.0
info:
  version: v1
  title: SimplBooks API
  description: |
    ## Overview
    
    ### What is SimplBooks API?
    
    SimplBooks API is built for accessing your account data directly via HTTP programmatically. It means that you can add and modify your data on your Simplbooks account without opening it in your web browser. API allows connecting 3rd party applications or custom software such as cash registers or production management systems and to exchange information automatically.
    
    ### How to use SimplBooks API?
    
    In order to use SimplBooks API you have to have **API enabled** on your account. If you are not sure wheather your subscription includes API then please do contact our sales or support staff and we'll help you get started.
    
    After activating API you will need to create additional API user under Settings > users, generate API token for the new user and you are all set to start using API. We strongly recommend you read through all the general info as there are some standards which have to be followed by developers.
    
    ### Request sending limits
    
    We have implemented some limitations as to how many requests per minute can be sent and processed to ensure best experience for both our regular users as well as our power users via API. One can send up to **60 requests per minute**. Over 60 requests per minute will generate an error response but will still be counted as usual requests so it is necessary to wait before sending new requests.
    
    ## Authentication
    
      All API calls made to your SimplBooks account need to be authenticated with special token and sent over secure channel (https). API users and tokens can be created and modified only if API module has been activated on your account.
      Token is generated for all API users on your account and it can be easily regenerated in case you think it has leaked. This token is used to check and validate if the query is authorized.
    
      Each query must have a `X-Simplbooks-Token` header set for this reason.
    
      Generated token consists of numbers and letters, e.g: 5e7c2b8035bb7533453450f7bce3e3cd
    
      As soon as you know your token you can start building API requests.
    
      Request header example with CURL
      ```
      curl -H "X-Simplbooks-Token: 5e7c2b8035bb7533453450f7bce3e3cd" \
      https://app.simplbooks.com/company_id/api/invoices/get/123
      ```
    
      <SecurityDefinitions />
    
    ## Requests
    
      Here is some more info on building API requests to help you get started. On the left you'll fint a complete list of API calls you can use to interact with your SimplBooks account.
    
      ### Request URL format
    
      `https://app.simplbooks.com/company_id/api/category/action/id`
    
      Every API request URL consisting of the following parts:
    
      |   |   |
      | --- | --- |
      | company_id | Unique ID of your account (for example 0fdf33a5c10c384986f81fc45a444f22) |
      | category | Category of the request (such as clients, invoices, etc) |
      | action | Action to be performed by this request (for example list, get, create, delete) |
      | id | ID of the object to perform the request on. Used only for some of the API calls. |
    
      If we put all these parts together, we will get a request URL like this:
    
      `https://app.simplbooks.com/company_id/api/clients/get/1`
    
      Request example with CURL
      ```
      curl -H "X-Simplbooks-Token: 5e7c2b8035bb7533453450f7bce3e3cd" \
      https://app.simplbooks.com/company_id/api/clients/get/1
      ```
    
      ### Request body
      For some API request you have to include more information than only URL. These parameters are forwarded in request body. Detailed information can be found on each request category page.
    
      Request body is typically needed for calls like create and update.
    
      ### Data types
      All API calls follow some common rules on data types:
    
      * Dates are always represented as "yyyy-MM-dd" (e.g. 2015-07-15)
      * Timestamps are always represented as "yyyy-MM-dd HH:mm:ss" (e.g. 2015-07-15 14:31:12)
      * Booleans are represented as 1 (true) or 0 (false) when submitting data as "form data"
      * Decimals use dot as decimal place separator (no commas)
    
      ### Data formats
      Request body can be submitted in different formats. Request format can be adjusted with HTTP header `X-Input-Format` which will accept one of the following values:
    
      * FormData (default)
      * JSON
      * Raw - data in original format, e.g E-Invoice XML
    
      POST request example with CURL (form data)
      ```
      curl \
      -H "X-Simplbooks-Token: 5e7c2b8035bb7533453450f7bce3e3cd" \
      -X POST \
      -F "Client[name]=Company" \
      -F "Client[address_street]=Test" \
      https://app.simplbooks.com/company_id/api/clients/create
      ```
    
      POST request example with CURL (JSON)
      ```
      curl \
      -H "X-Simplbooks-Token: 5e7c2b8035bb7533453450f7bce3e3cd" \
      -H "X-Input-Format: json" \
      -X POST \
      -d '{"Client":{"name":"Company","address_street":"Test"}}' \
      https://app.simplbooks.com/company_id/api/clients/create
      ```
    
    ## Responses
    
      Each response from server contains information about the request itself as well as data returned by called action. In case your request couldn't be executed you will find an error code and description in response.
    
      Response has a unified overall structure and contains the same fields, except the information stored under data key which is category and action specific. Please see the API calls specification for any specific calls.
    
      Following table shows the structure of the response:
    
      | Key | Description |
      | --- | --- |
      | status | response status code which is also reflected in HTTP header |
      | duration | duration of request in seconds |
      | inserted_id | ID of newly created object e.g. in case of create action |
      | data | data returned by called action |
      | response | response message on successful operation |
      | errors | error description - can be general error or validation error |
    
      ### Examples
    
      ```
      {
        "status": 200,
        "duration": "0.0463",
        "inserted_id": 0,
        "data": {...}
      }
      ```
    
      ```
      {
        "status": 200,
        "duration": "0.3343",
        "inserted_id": "1",
        "response": "New invoice saved."
      }
      ```
    
      ```
      {
        "status": 401,
        "duration": "0.0181",
        "inserted_id": 0,
        "errors": [
            "API token is missing"
        ],
      }
      ```
    
      ### Response status code
    
      Status can be one of the following values:
    
      * 200 - successful request
      * 4XX - invalid request
      * 5XX - temporary server error
    
      ### Response formats
      Response can be returned in three different formats depending on your needs. By default API will respond with JSON formated response structure. Response output format can be easily adjusted with HTTP header `X-Output-Format` which will accept one of the following values:
    
      * JSON (default)
      * XML
      * Screen - data is printed out in human-readable form. Useful for testing/debugging
      * Raw - data is returned in original format, e.g PDF invoice
    
    ## Error handling
    
      In case submitted request cannot be performed or fails validation then server will return appropriate error response.
    
      If status code is not `200` then there was some kind of error or failure with the request and in this case `errors` element should be checked. This element contains a list which is usually just one item in length but in case of validation errors might contain more than one item.
    
      ### Example
    
      For example if you send a request to get details about an invoice with ID number 22 but this invoice doesn't exist in system. In this server will will return with the following response:
    
      URL for the request
      `https://app.simplbooks.com/company_id/api/invoices/get/22`
    
      Response from server
      ```
      {
        "status": 400,
        "duration: "0.0297",
        "inserted_id": 0,
        "errors": [
            "Invoice with given ID does not exist."
        ],
      }
      ```
      Please note that even though we received an error - `duration` and `inserted_id` fields are still filled and returned.
    
      ### Error codes and descriptions
      See the following list for standard error codes and their descriptions:

      * 400 - Signature of the request is missing.
      * 400 - Signature of the request is invalid.
      * 400 - Validation error from SimplBooks system.
      * 400 - The number of requested entries is too big.
      * 401 - API token in HTTP header is missing.
      * 403 - Used API token is expired or wrong.
      * 403 - User is not allowed to use API calls.
      * 403 - User is not active in the system.
      * 403 - User doesn't have permissions to perform this operation.
      * 404 - Category of API call is missing.
      * 404 - Action of API call is missing.
      * 404 - Specified API call is not recognized.
      * 429 - Number of requests in over quota.
