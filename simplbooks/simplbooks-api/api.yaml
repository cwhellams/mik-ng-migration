servers:
  - url: https://app.simplbooks.com/{company_id}/api
    variables:
      company_id:
        default: ""
        description: Unique ID of your account (for example 0fdf33a5c10c384986f81fc45a444f22)
tags:
  - name: Items
    description: API calls to manage inventory items. Here you can find calls to create new, update or delete existing items. Includes also search call and call used to query current remaining stock of the item.
  - name: Clients
    description: Includes API calls to managing client information such as creating new client, updating data for existing client or deleting client from database. You can also search clients and display already saved client's data.
  - name: Client notes
    description: Includes API calls to managing client notes such as creating new, updating data for existing note or deleting note from database.
  - name: Delivery addresses
    description: This section includes API calls for managing delivery addresses. You can create new addresses, update or delete existing ones, or retrieve a list of addresses based on specified criteria.
  - name: Employees
    description: This section contains API calls to manage employees - such as create, update or delete existing employee. Also you can use a call for listing according to specified criteria.
  - name: Financial accounts
    description: This section contains API calls to get information about existing financial accounts.
  - name: Bank accounts and cash
    description: This section contains API calls to get information about existing bank accounts and cash registers.
  - name: Receipts
    description: Contains API calls to manage receipts - you can create, update or delete existing receipt. Also you can use a call for listing according to specified criteria and other more specific calls listed below.
  - name: Invoices
    description: This section contains API calls to manage sales invoices - such as create new one or update or delete existing sales invoices. Also you can use a call for listing according to specified criteria.
  - name: Payments
    description: Contains API calls to manage payments to suppliers or reporting persons - you can create, update or delete existing payment. Also you can use a call for listing according to specified criteria and other more specific calls listed below.
  - name: Price offers
    description: This section contains API calls to manage price offers - such as create, update or delete existing price offer. Also you can use a call for listing according to specified criteria.
  - name: Purchases
    description: This section contains API calls to manage purchase invoices - such as create, update or delete existing purchase invoice. Also you can use a call for listing according to specified criteria.
  - name: Purchase orders
    description: This section contains API calls to manage purchase orders - such as create, update or delete purchase order. Also you can use a call for listing according to specified criteria.
  - name: Sales orders
    description: This section contains API calls to manage sales orders - such as create new one or update or delete existing sales orders. Also you can use a call for listing according to specified criteria.
  - name: Unbilled works
    description: This section contains API calls to manage unbilled works - such as create, update or delete existing task. Also you can use a call for listing according to specified criteria.
  - name: VAT types
    description: This section contains API calls to get information about existing VAT types.
  - name: Warehouses
    description: This section contains API calls to manage warehouses - such as create, update or delete existing warehouse. Also you can use a call for listing according to specified criteria.
