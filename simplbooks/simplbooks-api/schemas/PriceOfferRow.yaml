type: object
properties:
  id:
    type: integer
  warehouse_id:
    type: integer
    example: 34
  article_id:
    type: integer
    example: 12
  code:
    type: string
    example: 15234
  name:
    type: string
    example: 'Concrete throw pillow'
  contents:
    type: string
    example: 'Gluten free'
  unit:
    type: string
    example: 'Kg.'
  amount:
    type: number
    example: 9000.1
  price_per_unit:
    type: number
    example: 0.05
  worker:
    type: string
    example: 'Batman'
  vat:
    type: number
    example: 20
  vat_type_id:
    type: integer
    example: 5
  discount:
    type: number
    example: 0
  Projects:
    $ref: '../schemas/Projects.yaml'
