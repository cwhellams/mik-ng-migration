type: object
properties:
  id:
    type: integer
  client_id:
    type: integer
    example: '100'
  client_name:
    type: string
    example: 'Santa Claws'
  client_reg_no:
    type: string
    example: '393254119302'
  client_vat_no:
    type: string
    example: ''
  client_address_street:
    type: string
    example: 'South Pole Lane 15/a'
  client_address_city:
    type: string
    example: 'Viljandi'
  client_address_postal_code:
    type: string
    example: '35004'
