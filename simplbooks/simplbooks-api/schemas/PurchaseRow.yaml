type: object
properties:
  id:
    type: integer
    description: ID of the row
    example: 3
  warehouse_id:
    type: integer
    description: ID of the associated warehouse
    example: 5
  article_id:
    type: integer
    description: ID of the associated item
    example: 13
  code:
    type: string
    description: Code of the associated item
    example: 'OO6'
  name:
    type: string
    description: Name of the item or service
    example: 'Antiviral toilet paper'
  unit:
    type: string
    description: Name of the unit
    example: 'Pcs.'
  amount:
    type: number
    description: Quantity
    example: 12
  sum:
    type: number
    description: Row sum
    example: 4.95
  vat:
    type: number
    description: VAT percentage value
    example: 14
  vat_type_id:
    type: integer
    description: ID of the associated VAT type
    example: 6
  discount:
    type: number
    description: Discount percentage value
    example: 0
  expense_account_id:
    type: integer
    description: Expense account ID
    example: 3
  expense_account_code:
    type: string
    description: Expense account code
    example: 4100
  Projects:
    $ref: '../schemas/Projects.yaml'
