description: Too Many Requests
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: integer
          example: 429
        duration:
          type: number
          example: 0.0531
        errors:
          type: array
          items:
            type: string
            example: >-
              Inquiry failed! Number of permitted inquiries per minute: 60