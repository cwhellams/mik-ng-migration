type: object
properties:
  article_id:
    type: integer
    description: ID of the associated inventory item
    example: 100
  warehouse_id:
    type: integer
    description: ID of the warehouse associated with the inventory item
    example: 616
  name:
    type: string
    description: Name of the item or service
    example: "Double scrollwheel mouse"
  unit:
    type: string
    description: Unit of measurement
    example: "Pcs."
  amount:
    type: number
    description: Quantity
    example: 95
  price_per_unit:
    type: number
    description: Price per unit
    example: 3.5
  vat:
    type: number
    description: VAT rate
    example: 20
  vat_type_id:
    type: integer
    description: Identifier for the type of VAT applied
    example: 5
  discount:
    type: number
    description: Discount percentage
    example: 5
  contents:
    type: string
    description: Description or details
    example: "Scroll together with your buddy using only one mouse!"
  income_account_id:
    type: integer
    description: Income account identifier
    example: 35
