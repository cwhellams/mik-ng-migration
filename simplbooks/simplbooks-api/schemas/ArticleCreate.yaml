Article:
  type: object
  properties:
    code:
      type: string
      description: Code of the given item
      example: 'A-2565'
    ean:
      type: string
      description: EAN of the given item
      example: '4740123456789'
    name:
      description: String or object containing ISO 639-1 language code keys with localized names as values
      oneOf:
        - type: string
          example: 'Ergonomic keyboard Dell X-56'
        - type: object
          additionalProperties:
            x-additionalPropertiesName: locale
            type: string
          example:
            en_GB: 'Ergonomic keyboard Dell X-56'
    contents:
      description: String or object containing ISO 639-1 language code keys with localized contents as values
      oneOf:
        - type: string
          example: 'Model 2014, EN keyboard layout, black'
        - type: object
          additionalProperties:
            x-additionalPropertiesName: locale
            type: string
          example:
            en_GB: 'Model 2014, EN keyboard layout, black'
    unit:
      description: String or object containing ISO 639-1 language code keys with localized unit names as values
      oneOf:
        - type: string
          example: 'pcs'
        - type: object
          additionalProperties:
            x-additionalPropertiesName: locale
            type: string
          example:
            et_EE: 'tk'
            en_GB: 'pcs'
            ru_RU: 'шт'
    amount:
      type: number
      description: Default amount of the given item
      example: 1
    price_per_unit:
      type: number
      description: Default price of the given item
      example: 24.99
    sum_with_vat:
      type: boolean
      description: Whether or not the price accounts for VAT
      example: 0
      default: 0
    markup_value:
      description: In case of percent or fixed markup type, the amount of markup as either an absolute value or a percentage (without the percentage sign)
      type: number
      example: 0.00
    markup_type:
      type: string
      description: Default markup type
      example: 'none'
      enum: [percent, fixed, none]
      default: none
    is_inventory:
      type: boolean
      description: true if the given item is an inventory item, false if the given article is a service
      example: true
      default: false
    active:
      type: boolean
      description: whether or not this item is currently active
      example: true
      default: false
