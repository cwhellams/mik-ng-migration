type: object
properties:
  client_id:
    type: integer
    description: ID of the associated partner
    example: 123
  created:
    type: string
    description: Creation date
    example: 2019-06-01
  supply_date:
    type: string
    description: Supply date
    example: 2019-07-01
  number:
    type: string
    description: Unique number for the order
    example: "123"
  sent:
    type: string
    description: The date that the order was sent
    example: "2020-01-01"
  cancelled:
    type: string
    description: The date when the order was cancelled
    example: "2022-01-05"
  currency_name:
    type: string
    description: ISO 4217 currency code
    example: "EUR"
  currency_rate:
    type: number
    description: Ratio of chosen currency to the base currency
    example: 1.0
  language:
    type: string
    description: language code
    example: "et_EE"