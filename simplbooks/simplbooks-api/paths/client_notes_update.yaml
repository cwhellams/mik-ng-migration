post:
  tags:
    - Client notes
  summary: Update
  description: Updates existing client note with given ID.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            ClientNote:
              type: object
              properties:
                id:
                  type: integer
                  description: ID of the note
                  example: 1
                note:
                  type: string
                  description: New text contents of the note
                  example: This is a test note for client
  responses:
    200:
      $ref: '../schemas/UpdateSuccessResponse.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'
