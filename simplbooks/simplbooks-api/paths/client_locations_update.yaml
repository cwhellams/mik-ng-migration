post:
  tags:
    - Delivery addresses
  summary: Update
  description: Updates existing delivery address with given ID.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            ClientLocation:
              allOf:
                - type: object
                  properties:
                    id:
                      type: integer
                      description: ID of the note
                      example: 1
                - $ref: '../schemas/ClientLocation.yaml'
  responses:
    200:
      $ref: '../schemas/UpdateSuccessResponse.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'