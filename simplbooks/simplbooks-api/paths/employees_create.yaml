post:
  tags:
    - Employees
  summary: Create
  description: Creates a new employee.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            Employee:
              $ref: '../schemas/Employee.yaml'
  responses:
    200:
      $ref: '../schemas/CreateSuccessResponse.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'
