get:
  tags:
    - Payments
  summary: List
  description: Returns list of payments matching given criteria.
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
              description: filter payments to match a specific nonzero ID
              example: 2
            payment_date:
              type: string
              description: filter payments to match a specific date
              example: 2022-01-01
            description:
              type: string
              description: search for payments by description containing the given string
              example: 'the payment I made yesterday'
            income_account_id:
              type: integer
              description: filter payments to match a specific income account ID
              example: 2
            page:
              type: integer
              description: specifies from which page the list starts
              default: 1
            per_page:
              type: integer
              description: specifies how many records will be displayed per page
              default: 10
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              duration:
                type: number
                example: 0.0531
              data:
                type: array
                items:
                  type: object
                  properties:
                    Payment:
                      allOf:
                        - type: object
                          properties:
                            id:
                              type: integer
                        - $ref: '../schemas/Payment.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'
