post:
  tags:
    - Unbilled works
  summary: Update
  description: Updates existing task info with information from given parameters.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            Task:
              allOf:
                - type: object
                  properties:
                    id:
                      type: integer
                - $ref: '../schemas/Task.yaml'
            Projects:
              $ref: '../schemas/Projects.yaml'
  responses:
    200:
      $ref: '../schemas/UpdateSuccessResponse.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'
