post:
  tags:
    - Receipts
  summary: Create
  description: Create new receipt based on given parameters.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            Incoming:
              $ref: '../schemas/Incoming.yaml'
            Projects:
              $ref: '../schemas/Projects.yaml'
            invoice_id:
              type: integer
              description: ID of the associated invoice
              example: 5
  responses:
    200:
      $ref: '../schemas/CreateSuccessResponse.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'