get:
  tags:
    - Bank accounts and cash
  summary: Get
  description: Get information about the bank account or cash register with given ID.
  parameters:
    - name: id
      in: path
      description: ID of the account
      required: true
      schema:
        type: integer
        format: int64
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              duration:
                type: number
                example: 0.0531
              data:
                type: object
                properties:
                  IncomeAccount:
                    $ref: '../schemas/IncomeAccount.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'
