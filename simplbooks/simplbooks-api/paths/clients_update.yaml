post:
  tags:
    - Clients
  summary: Update
  description: Updates information in profile for the client with given ID.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            Client:
              allOf:
                - type: object
                  properties:
                    id:
                      type: integer
                - $ref: '../schemas/ClientData.yaml'
  responses:
    200:
      $ref: '../schemas/UpdateSuccessResponse.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'
