post:
  tags:
    - Payments
  summary: Create
  description: Create new payment based on given parameters.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            Payment:
              $ref: '../schemas/Payment.yaml'
            Projects:
              $ref: '../schemas/Projects.yaml'
            purchase_id:
              type: integer
              description: ID of the associated purchase
              example: 5
  responses:
    200:
      $ref: '../schemas/CreateSuccessResponse.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'