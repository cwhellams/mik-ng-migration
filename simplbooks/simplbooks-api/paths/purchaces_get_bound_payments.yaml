get:
  tags:
    - Purchases
  summary: Get Bound Payments
  description: Get payments bound to the purchase.
  parameters:
    - name: id
      in: path
      description: ID of the purchase
      required: true
      schema:
        type: integer
        format: int64
  responses:
    200:
      $ref: '../schemas/BoundPaymentsResponse.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'