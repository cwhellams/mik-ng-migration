post:
  tags:
    - Purchases
  summary: Update
  description: Updates existing purchase info with information from given parameters.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            Purchase:
              allOf:
                - type: object
                  properties:
                    id:
                      type: integer
                - $ref: '../schemas/PurchaseCreate.yaml'
            PurchaseRows:
              type: array
              items:
                type: object
                properties:
                  PurchaseRow:
                    $ref: '../schemas/PurchaseRowCreate.yaml'
                  Projects:
                    $ref: '../schemas/Projects.yaml'
  responses:
    200:
      $ref: '../schemas/UpdateSuccessResponse.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'
