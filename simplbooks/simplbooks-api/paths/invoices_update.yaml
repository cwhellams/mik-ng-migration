post:
  tags:
    - Invoices
  summary: Update
  description: Updates information for invoice with given ID number.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            Invoice:
              allOf:
                - type: object
                  properties:
                    id:
                      type: integer
                - $ref: '../schemas/InvoiceCreate.yaml'
            Tasks:
              type: array
              items:
                type: object
                properties:
                  Task:
                    allOf:
                      - type: object
                        properties:
                          id:
                            type: integer
                      - $ref: '../schemas/InvoiceRowCreate.yaml'
                  Projects:
                    $ref: '../schemas/Projects.yaml'
  responses:
    200:
      $ref: '../schemas/UpdateSuccessResponse.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'