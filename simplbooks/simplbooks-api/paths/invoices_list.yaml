get:
  tags:
    - Invoices
  summary: List
  description: Returns list of invoices matching given criteria.
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
              description: Filter invoices by ID
              example: 1
            client_id:
              type: integer
              description: Filter invoices to match a specific non-zero client ID
              example: 2
            invoice_number:
              type: string
              description: Search for invoices by number containing the given string
              example: "1234"
            client_name:
              type: string
              description: Search for invoices by client name containing the given string
              example: "Jaan Kaer"
            client_reg_no:
              type: string
              description: Search for invoices by client registration number containing the given string
              example: "321"
            created_from:
              type: string
              description: Filter invoices by creation date after and including the specified date
              example: "01-01-2021"
            created_until:
              type: string
              description: Filter invoices by creation date before and including the specified date
              example: "01-01-2022"
            page:
              type: integer
              description: Specifies the starting page number
              default: 1
            per_page:
              type: integer
              description: Specifies the number of records displayed per page
              default: 10
            fields:
              type: array
              description: Specifies the data field names to be returned
              items:
                type: string
                example: invoice_number
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              duration:
                type: number
                example: 0.0531
              data:
                type: array
                items:
                  type: object
                  properties:
                    invoices:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for the invoice
                        client_id:
                          type: integer
                          description: Unique identifier for the client
                          example: 123
                        client_name:
                          type: string
                          description: Name of the client
                          example: "SimplBooks OÜ"
                        client_reg_no:
                          type: string
                          description: Registration number of the client
                          example: "12213296"
                        client_vat_no:
                          type: string
                          description: VAT registration number of the client
                        created:
                          type: string
                          format: date
                          description: Date of the invoice
                          example: "2018-01-01"
                        transaction_date:
                          type: string
                          description: Accounting date of the invoice
                        due:
                          type: string
                          description: Due date for the invoice payment
                        number:
                          type: string
                          description: Unique number assigned to the invoice
                          example: "18001"
                        sum:
                          type: number
                          description: Total amount of the invoice, excluding VAT
                        vat:
                          type: number
                          description: Total VAT amount of the invoice
                        rounding:
                          type: number
                          description: Correction amount for rounding on the invoice
                        total_sum:
                          type: number
                          description: Total amount of the invoice, including VAT
                        row_sum_with_vat:
                          type: boolean
                          description: Indicates whether the invoice line amounts include VAT
                        currency_name:
                          type: string
                          description: ISO 4217 currency code for the invoice
                        currency_rate:
                          type: number
                          description: Exchange rate of the chosen currency to the base currency
                        sent:
                          type: string
                          description: Date when the invoice was sent
                        paid:
                          type: string
                          description: Date when the invoice was paid
                        proforma:
                          type: boolean
                          description: Indicates if this is a prepayment invoice
                        proforma_percent:
                          type: number
                          description: Percentage of the prepayment required
                        credit_invoice_for:
                          type: number
                          description: "ID of the credited invoice"
                          example: 0
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'