get:
  tags:
    - Purchases
  summary: Get XML
  description: Returns purchase with the given ID in XML format (E-invoice). Document data is encoded with base64 scheme.
  parameters:
    - name: id
      in: path
      description: ID of the purchase
      required: true
      schema:
        type: integer
        format: int64
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              duration:
                type: number
                example: 0.0531
              data:
                type: string
                description: file content in base64 encoding
                example: "PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGl..."
        application/xml:
          schema:
            type: string
            description: file content (NOT in base64 encoding)
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'