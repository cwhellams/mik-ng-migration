get:
  tags:
    - Invoices
  summary: Get Bound Receipts
  description: Get id-s of receipts bound to the invoice.
  parameters:
    - name: id
      in: path
      description: ID of the invoice
      required: true
      schema:
        type: integer
        format: int64
  responses:
    200:
      $ref: '../schemas/BoundReceiptsResponse.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'