get:
  tags:
    - Employees
  summary: List
  description: Returns list of employees found on given criteria.
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            first_name:
              type: string
              description: search for an employee whose name matches given string
              example: 'John'
            starting_date_from:
              type: string
              description: ...
              example: '2022-01-01'
            page:
              type: integer
              description: specifies from which page the list starts
              default: 1
            per_page:
              type: integer
              description: specifies how many records will be displayed per page
              default: 10
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              duration:
                type: number
                example: 0.0531
              data:
                type: array
                items:
                  type: object
                  properties:
                    Employee:
                      allOf:
                        - type: object
                          properties:
                            id:
                              type: integer
                              description: Unique identifier (ID)
                              example: 1
                        - $ref: '../schemas/EmployeeBasic.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'
