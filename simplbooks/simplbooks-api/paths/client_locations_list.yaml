get:
  tags:
    - Delivery addresses
  summary: List
  description: Returns list of delivery addresses found on given criteria.
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
              description: filter delivery addresses to match a specific ID
              example: 2
            client_id:
              type: integer
              description: filter delivery addresses to match a specific client
              example: 2
            code:
              type: string
              description: filter delivery addresses to match a specific code
              example: abc123
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              duration:
                type: number
                example: 0.0531
              data:
                type: array
                items:
                  type: object
                  properties:
                    ClientLocation:
                      allOf:
                        - type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                        - $ref: '../schemas/ClientLocation.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'
