get:
  tags:
    - Client notes
  summary: List
  description: Returns list of client notes found on given criteria.
  requestBody:
    required: false
    content:
      application/json:
        schema:
            $ref: '../schemas/ClientNoteListRequest.yaml'
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              duration:
                type: number
                example: 0.0531
              data:
                type: array
                items:
                  type: object
                  properties:
                    ClientNote:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        created:
                          type: string
                          example: 2016-01-15 15:26:02
                        creator:
                          type: integer
                          description: User ID
                          example: 2
                        client_id:
                          type: integer
                          example: 5
                        note:
                          type: string
                          example: This is a test note for client
                        object_type:
                          type: string
                          description: Object type. Empty if note is not bound to a specific document.
                          example: Invoice
                        object_id:
                          type: integer
                          description: Object ID, e.g related invoice ID. Filled only if object type is set.
                          example: 123
                    Client:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Client name
                          example: SimplBooks OÜ
                    User:
                      type: object
                      properties:
                        name:
                          type: string
                          description: User name
                          example: John Doe
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'