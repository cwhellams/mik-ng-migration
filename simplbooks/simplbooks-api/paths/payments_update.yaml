post:
  tags:
    - Payments
  summary: Update
  description: Updates existing payment info with information from given parameters.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            Payment:
              allOf:
                - type: object
                  properties:
                    id:
                      type: integer
                - $ref: '../schemas/Payment.yaml'
            Projects:
              $ref: '../schemas/Projects.yaml'
            purchase_id:
              type: integer
              description: ID of the associated purchase
              example: 5
  responses:
    200:
      $ref: '../schemas/UpdateSuccessResponse.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'
