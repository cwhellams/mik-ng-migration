post:
  tags:
    - Price offers
  summary: Cancel
  description: Sets status of offer with given ID as cancelled.
  parameters:
    - name: id
      in: path
      description: ID of the price offer
      required: true
      schema:
        type: integer
        format: int64
  responses:
    200:
      $ref: '../schemas/OkResponse.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'