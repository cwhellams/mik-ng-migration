get:
  tags:
    - Items
  summary: List
  description: Returns list of items matching given criteria.
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: '../schemas/ArticleListRequest.yaml'
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            $ref: '../schemas/ArticleListResponse.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'