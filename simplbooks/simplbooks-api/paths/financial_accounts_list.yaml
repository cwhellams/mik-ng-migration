get:
  tags:
    - Financial accounts
  summary: List
  description: Returns list of financial accounts matching given criteria.
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
              description: filter financial accounts to match a specific nonzero ID
              example: 2
            code:
              type: string
              description: filter financial accounts to match a specific code
              example: abc123
            name:
              type: string
              description: search for financial accounts by name containing the given string
              example: põssapank
            active:
              type: boolean
              description: search for financial accounts by active status containing the given string
              example: true
            page:
              type: integer
              description: specifies from which page the list starts
              default: 1
            per_page:
              type: integer
              description: specifies how many records will be displayed per page
              default: 10
            fields:
              type: array
              description: specifies the data field names to be returned
              items:
                type: string
                example: code

  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              duration:
                type: number
                example: 0.0531
              data:
                type: array
                items:
                  type: object
                  properties:
                    FinancialAccount:
                      $ref: '../schemas/FinancialAccount.yaml'
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'
