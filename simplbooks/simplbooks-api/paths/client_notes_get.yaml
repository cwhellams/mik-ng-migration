get:
  tags:
    - Client notes
  summary: Get
  description: Returns information for the client note with given ID.
  parameters:
    - name: id
      in: path
      description: ID of the client note
      required: true
      schema:
        type: integer
        format: int64
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              duration:
                type: number
                example: 0.0531
              data:
                type: object
                properties:
                  ClientNote:
                    $ref: '../schemas/ClientNote.yaml'
                  Client:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Client name
                        example: SimplBooks OÜ
                  User:
                    type: object
                    properties:
                      name:
                        type: string
                        description: User name
                        example: John Doe
    400:
      $ref: '../schemas/error400.yaml'
    401:
      $ref: '../schemas/error401.yaml'
    403:
      $ref: '../schemas/error403.yaml'
    429:
      $ref: '../schemas/error429.yaml'