name: mik-intranet-test
region: fra1
vpc:
  id: ${DO_MIK_VPC_UUID}
domains:
  - domain: ${DOMAIN}
    type: PRIMARY
  # Admin app's own subdomain — mirrors twr.mik.fi in
  # .do/mik-intranet-prod.yaml. Not auto-DNS-managed (no `zone:`), matching
  # ${DOMAIN} above: beta-twr.mik.fi must be pointed at this app externally.
  - domain: beta-twr.mik.fi
    type: ALIAS
ingress:
  rules:
    # /api, /auth, /health, /t carry no `authority` match, so they apply
    # regardless of which of the app's domains the request arrived on — the
    # backend is one service shared by both beta.mik.fi and beta-twr.mik.fi.
    - component:
        name: mik-intranet-api-test
        preserve_path_prefix: true
      match:
        path:
          prefix: /api
    - component:
        name: mik-intranet-api-test
        preserve_path_prefix: true
      match:
        path:
          prefix: /auth
    - component:
        name: mik-intranet-api-test
        preserve_path_prefix: true
      match:
        path:
          prefix: /health
    - component:
        name: mik-intranet-api-test
        preserve_path_prefix: true
      match:
        path:
          prefix: /t
    # Host-based split: beta-twr.mik.fi goes to the admin app, everything else
    # (beta.mik.fi) falls through to the member frontend below. This rule must
    # come before the authority-less catch-all — ingress rules are evaluated
    # in order and the first match wins.
    - component:
        name: mik-intranet-admin
      match:
        authority:
          exact: beta-twr.mik.fi
        path:
          prefix: /
    - component:
        name: mik-intranet-frontend
      match:
        path:
          prefix: /
services:
  - name: mik-intranet-api-test

    image:
      registry_type: DOCR
      repository: mik-dev-team/mik-ng
      tag: ${IMAGE_TAG}

    http_port: 3000 #Setup port mapping from public internet port 80 or 443, the platform will forward traffic to this port

    log_destinations:
      - name: mik-intranet-logtail
        logtail:
          token: ${BETTERSTACK_API_TOKEN}
    envs:
      - key: DATABASE_URL
        value: '${DATABASE_URL}'
        type: SECRET
      - key: SMTP_PASSWORD
        value: '${SMTP_PASSWORD}'
        type: SECRET
      - key: ACCESS_TOKEN_SECRET
        value: '${ACCESS_TOKEN_SECRET}'
        type: SECRET
      - key: MAGIC_LINK_SECRET
        value: '${MAGIC_LINK_SECRET}'
        type: SECRET
      - key: REFRESH_TOKEN_SECRET
        value: '${REFRESH_TOKEN_SECRET}'
        type: SECRET
      - key: BETTERSTACK_API_TOKEN
        value: '${BETTERSTACK_API_TOKEN}'
        type: SECRET
      - key: ACCESS_TOKEN_EXPIRATION
        value: '${ACCESS_TOKEN_EXPIRATION}'
        type: GENERAL
      - key: REFRESH_TOKEN_EXPIRATION
        value: '${REFRESH_TOKEN_EXPIRATION}'
        type: GENERAL
      - key: LOG_LEVEL
        value: '${LOG_LEVEL}'
        type: GENERAL
      - key: SMTP_LOGIN
        value: '${SMTP_LOGIN}'
        type: GENERAL
      - key: PUBLIC_URL
        value: '${PUBLIC_URL}'
        type: GENERAL
      - key: DB_SSL
        value: 'true'
        type: GENERAL
      - key: SIMPLBOOKS_OUTBOX_WORKER_ENABLED
        value: '${SIMPLBOOKS_OUTBOX_WORKER_ENABLED}'
        type: GENERAL
      - key: SIMPLBOOKS_DRY_RUN
        value: '${SIMPLBOOKS_DRY_RUN}'
        type: GENERAL
      - key: SIMPLBOOKS_COMPANY_ID
        value: '${SIMPLBOOKS_COMPANY_ID}'
        type: GENERAL
      - key: SIMPLBOOKS_BASE_URI
        value: '${SIMPLBOOKS_BASE_URI}'
        type: GENERAL
      - key: SIMPLBOOKS_API_KEY
        value: '${SIMPLBOOKS_API_KEY}'
        type: SECRET
      - key: DIGITAL_OCEAN_SPACES_KEY
        value: '${DIGITAL_OCEAN_SPACES_KEY}'
        type: SECRET
      - key: DIGITAL_OCEAN_SPACES_SECRET
        value: '${DIGITAL_OCEAN_SPACES_SECRET}'
        type: SECRET
      - key: DIGITAL_OCEAN_SPACES_REGION
        value: '${DIGITAL_OCEAN_SPACES_REGION}'
        type: GENERAL
      - key: DIGITAL_OCEAN_SPACES_ENDPOINT
        value: '${DIGITAL_OCEAN_SPACES_ENDPOINT}'
        type: GENERAL
      - key: EXPENSE_RECEIPT_BUCKET
        value: '${EXPENSE_RECEIPT_BUCKET}'
        type: GENERAL
      - key: MEMBER_AVATAR_BUCKET
        value: '${MEMBER_AVATAR_BUCKET}'
        type: GENERAL
      - key: FIELD_ENCRYPTION_KEY
        value: '${FIELD_ENCRYPTION_KEY}'
        type: SECRET
      - key: MILEAGE_MAX_KM
        value: '${MILEAGE_MAX_KM}'
        type: GENERAL
      - key: BREVO_API_URL
        value: '${BREVO_API_URL}'
        type: GENERAL
      - key: BREVO_API_KEY
        value: '${BREVO_API_KEY}'
        type: SECRET
      - key: AIRCRAFT_MAILING_LISTS
        value: '${AIRCRAFT_MAILING_LISTS}'
        type: GENERAL
      - key: KALUSTO_EMAIL
        value: '${KALUSTO_EMAIL}'
        type: GENERAL
      - key: AIRCRAFT_DOCUMENT_EXPIRY_WORKER_ENABLED
        value: '${AIRCRAFT_DOCUMENT_EXPIRY_WORKER_ENABLED}'
        type: GENERAL
      - key: AIRCRAFT_DOCUMENT_EXPIRY_WORKER_RUN_ON_STARTUP
        value: '${AIRCRAFT_DOCUMENT_EXPIRY_WORKER_RUN_ON_STARTUP}'
        type: GENERAL
      - key: AIRCRAFT_DOCUMENT_EXPIRY_REMINDER_DAYS
        value: '${AIRCRAFT_DOCUMENT_EXPIRY_REMINDER_DAYS}'
        type: GENERAL
      - key: PUSH_NOTIFICATION_WORKER_ENABLED
        value: '${PUSH_NOTIFICATION_WORKER_ENABLED}'
        type: GENERAL
      - key: PUSH_NOTIFICATION_HOURS_BEFORE
        value: '${PUSH_NOTIFICATION_HOURS_BEFORE}'
        type: GENERAL
      - key: VAPID_PUBLIC_KEY
        value: '${VAPID_PUBLIC_KEY}'
        type: SECRET
      - key: VAPID_PRIVATE_KEY
        value: '${VAPID_PRIVATE_KEY}'
        type: SECRET
      - key: VAPID_SUBJECT
        value: '${VAPID_SUBJECT}'
        type: GENERAL
      - key: BREVO_SYNC_WORKER_ENABLED
        value: '${BREVO_SYNC_WORKER_ENABLED}'
        type: GENERAL
      - key: BREVO_SYNC_WORKER_RUN_ON_STARTUP
        value: '${BREVO_SYNC_WORKER_RUN_ON_STARTUP}'
        type: GENERAL
      - key: EQUIPMENT_FEE_DISCOUNT_PER_HOUR
        value: '${EQUIPMENT_FEE_DISCOUNT_PER_HOUR}'
        type: GENERAL
      - key: SIMPLBOOKS_INVOICE_PAYMENT_WORKER_RUN_ON_STARTUP
        value: '${SIMPLBOOKS_INVOICE_PAYMENT_WORKER_RUN_ON_STARTUP}'
        type: GENERAL
      - key: SIMPLBOOKS_INVOICE_PAYMENT_WORKER_ENABLED
        value: '${SIMPLBOOKS_INVOICE_PAYMENT_WORKER_ENABLED}'
        type: GENERAL
      - key: OVERDUE_INVOICE_WORKER_ENABLED
        value: '${OVERDUE_INVOICE_WORKER_ENABLED}'
        type: GENERAL
      - key: OVERDUE_INVOICE_WORKER_RUN_ON_STARTUP
        value: '${OVERDUE_INVOICE_WORKER_RUN_ON_STARTUP}'
      - key: WEATHER_API_BASE_URL
        value: '${WEATHER_API_BASE_URL}'
        type: GENERAL
      - key: WEATHER_AUDIO_BASE_URL
        value: '${WEATHER_AUDIO_BASE_URL}'
        type: GENERAL
      - key: OVERDUE_INVOICE_SUSPENSION_DAYS
        value: '${OVERDUE_INVOICE_SUSPENSION_DAYS}'
        type: GENERAL
      - key: OCCURRENCE_NOTIFICATION_WORKER_ENABLED
        value: '${OCCURRENCE_NOTIFICATION_WORKER_ENABLED}'
        type: GENERAL
      - key: CORS_ALLOWED_ORIGINS
        # Must include https://beta-twr.mik.fi (set as a GitHub Actions
        # var/secret outside this repo) — the admin app calls this same
        # backend cross-origin from its own subdomain. See COOKIE_DOMAIN
        # below for the other half of making that a shared session.
        value: '${CORS_ALLOWED_ORIGINS}'
        type: SECRET
      - key: COOKIE_PREFIX
        # Literal, not templated, and MUST differ from every other deployment
        # that shares COOKIE_DOMAIN. 'beta.mik.fi / beta-twr.mik.fi' and the production
        # hosts share only 'mik.fi' as a common suffix, so COOKIE_DOMAIN alone
        # cannot keep the two environments apart — both would write one cookie
        # named 'accessToken' on '.mik.fi' and steal each other's sessions.
        # The name is what separates them. The backend refuses to start if
        # COOKIE_DOMAIN is set and this is not.
        value: 'beta_'
        type: GENERAL
      - key: COOKIE_DOMAIN
        # Literal, not templated: shares the auth cookies across every
        # mik.fi subdomain (beta.mik.fi, beta-twr.mik.fi) so signing in on
        # one authenticates the other. See apps/backend/src/routes/auth/cookies.ts.
        value: '.mik.fi'
        type: GENERAL
      - key: SIMPLBOOKS_MEMBER_SYNC_ENABLED
        value: '${SIMPLBOOKS_MEMBER_SYNC_ENABLED}'
        type: GENERAL
      - key: OVERDUE_INVOICE_GRACE_PERIOD_DAYS
        value: '${OVERDUE_INVOICE_GRACE_PERIOD_DAYS}'
        type: GENERAL
      - key: VITE_TURNSTILE_SITE_KEY
        value: '${VITE_TURNSTILE_SITE_KEY}'
        type: GENERAL
      - key: TURNSTILE_SECRET_KEY
        value: '${TURNSTILE_SECRET_KEY}'
        type: SECRET
      - key: TURNSTILE_ENABLED
        value: 'true'
      - key: DOCUMENT_URL_TTL_SECS
        value: '${DOCUMENT_URL_TTL_SECS}'
        type: GENERAL
      - key: TINY_URL_BASE_URL
        value: '${TINY_URL_BASE_URL}'
        type: GENERAL
      - key: MIK_LOGO_PATH
        value: '${MIK_LOGO_PATH}'
        type: GENERAL
      - key: SIMPLBOOKS_CREDIT_NOTE_INCOME_ACCT_ID
        value: '${SIMPLBOOKS_CREDIT_NOTE_INCOME_ACCT_ID}'
        type: GENERAL
      - key: MEDICAL_CHECK_ENABLED
        value: '${MEDICAL_CHECK_ENABLED}'
        type: GENERAL
      - key: TINY_URL_CLEANUP_WORKER_ENABLED
        value: '${TINY_URL_CLEANUP_WORKER_ENABLED}'
        type: GENERAL
      - key: TINY_URL_CLEANUP_WORKER_RUN_ON_STARTUP
        value: '${TINY_URL_CLEANUP_WORKER_RUN_ON_STARTUP}'
        type: GENERAL
      - key: MAILBOX_CLEANUP_WORKER_ENABLED
        value: '${MAILBOX_CLEANUP_WORKER_ENABLED}'
        type: GENERAL
      - key: MAILBOX_CLEANUP_WORKER_RUN_ON_STARTUP
        value: '${MAILBOX_CLEANUP_WORKER_RUN_ON_STARTUP}'
        type: GENERAL
      - key: QUALIFICATION_EXPIRY_WORKER_ENABLED
        value: '${QUALIFICATION_EXPIRY_WORKER_ENABLED}'
        type: GENERAL
      - key: QUALIFICATION_EXPIRY_WORKER_RUN_ON_STARTUP
        value: '${QUALIFICATION_EXPIRY_WORKER_RUN_ON_STARTUP}'
        type: GENERAL
      - key: QUALIFICATION_EXPIRY_REMINDER_DAYS
        value: '${QUALIFICATION_EXPIRY_REMINDER_DAYS}'
        type: GENERAL
      - key: MILEAGE_HETU_PURGE_WORKER_ENABLED
        value: '${MILEAGE_HETU_PURGE_WORKER_ENABLED}'
        type: GENERAL
      - key: MILEAGE_HETU_PURGE_WORKER_RUN_ON_STARTUP
        value: '${MILEAGE_HETU_PURGE_WORKER_RUN_ON_STARTUP}'
        type: GENERAL
      - key: BOOKING_REMINDER_WORKER_ENABLED
        value: '${BOOKING_REMINDER_WORKER_ENABLED}'
        type: GENERAL
      - key: BOOKING_REMINDER_HOURS_BEFORE
        value: '${BOOKING_REMINDER_HOURS_BEFORE}'
        type: GENERAL
      - key: JUNIOR_PROMOTION_WORKER_ENABLED
        value: '${JUNIOR_PROMOTION_WORKER_ENABLED}'
        type: GENERAL
      - key: JUNIOR_PROMOTION_WORKER_RUN_ON_STARTUP
        value: '${JUNIOR_PROMOTION_WORKER_RUN_ON_STARTUP}'
        type: GENERAL
      - key: SIMPLBOOKS_MEMBER_SYNC_RUN_ON_STARTUP
        value: '${SIMPLBOOKS_MEMBER_SYNC_RUN_ON_STARTUP}'
        type: GENERAL
      - key: NOMINATIM_BASE_URL
        value: '${NOMINATIM_BASE_URL}'
        type: GENERAL
      - key: NOMINATIM_USER_AGENT
        value: '${NOMINATIM_USER_AGENT}'
        type: GENERAL
      - key: OSRM_BASE_URL
        value: '${OSRM_BASE_URL}'
        type: GENERAL
      - key: ORDER_NOTIFICATION_EMAIL
        value: '${ORDER_NOTIFICATION_EMAIL}'
        type: GENERAL
      - key: NODE_ENV
        value: 'production'
        type: GENERAL
    instance_count: 1
    health_check:
      http_path: /health
      port: 3000
      initial_delay_seconds: 10
      period_seconds: 60
      failure_threshold: 3
      success_threshold: 2
    alerts:
      - rule: CPU_UTILIZATION
        disabled: false
        operator: GREATER_THAN
        value: 85
        window: FIVE_MINUTES
      - operator: GREATER_THAN
        rule: MEM_UTILIZATION
        value: 85
        window: FIVE_MINUTES
static_sites:
  - name: mik-intranet-frontend
    github:
      repo: MIK-dev-team/mik-ng
      branch: ${DEPLOY_BRANCH}

    # Build from workspace root so pnpm can see:
    # - package.json
    # - pnpm-lock.yaml
    # - pnpm-workspace.yaml
    source_dir: /

    output_dir: /apps/frontend/dist

    build_command: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm --filter frontend build

    environment_slug: node-js

    envs:
      - key: VITE_API_TARGET
        value: '${VITE_API_TARGET}'
        type: GENERAL
        scope: RUN_AND_BUILD_TIME

      - key: VITE_TURNSTILE_SITE_KEY
        value: '${VITE_TURNSTILE_SITE_KEY}'
        type: GENERAL
        scope: RUN_AND_BUILD_TIME

      - key: DEPLOY_TIMESTAMP
        value: '${DEPLOY_TIMESTAMP}'
        type: GENERAL
        scope: RUN_AND_BUILD_TIME

    catchall_document: index.html

  # Admin app — served at beta-twr.mik.fi, routed by the authority-matched
  # ingress rule above rather than a path. Backend calls stay pointed at
  # ${DOMAIN} (beta.mik.fi, same VITE_API_TARGET as the frontend below), which
  # makes them cross-origin from beta-twr.mik.fi; COOKIE_DOMAIN and
  # CORS_ALLOWED_ORIGINS on mik-intranet-api-test are what makes that work.
  - name: mik-intranet-admin
    github:
      repo: MIK-dev-team/mik-ng
      branch: ${DEPLOY_BRANCH}

    source_dir: /

    output_dir: /apps/admin/dist

    build_command: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm --filter admin build

    environment_slug: node-js

    envs:
      - key: VITE_API_TARGET
        value: '${VITE_API_TARGET}'
        type: GENERAL
        scope: RUN_AND_BUILD_TIME

      - key: VITE_TURNSTILE_SITE_KEY
        value: '${VITE_TURNSTILE_SITE_KEY}'
        type: GENERAL
        scope: RUN_AND_BUILD_TIME

      - key: DEPLOY_TIMESTAMP
        value: '${DEPLOY_TIMESTAMP}'
        type: GENERAL
        scope: RUN_AND_BUILD_TIME

    catchall_document: index.html
