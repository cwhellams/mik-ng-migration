name: mik-intra
region: fra1
services:
  - name: mik-backend
    
    image:
      registry_type: DOCR      
      repository: mik-dev-team/mik-ng      

    http_port: 3000 #Setup port mapping from public internet port 80 or 443, the platform will forward traffic to this port
    
    envs:
      - key: DATABASE_URL
        value: ${DATABASE_URL}
        type: SECRET
      - key: SMTP_PASSWORD
        value: ${SMTP_PASSWORD}
        type: SECRET
      - key: ACCESS_TOKEN_SECRET
        value: ${ACCESS_TOKEN_SECRET}
        type: SECRET
      - key: MAGIC_LINK_SECRET
        value: ${MAGIC_LINK_SECRET}
        type: SECRET
      - key: REFRESH_TOKEN_SECRET
        value: ${REFRESH_TOKEN_SECRET}
        type: SECRET
      - key: ACCESS_TOKEN_EXPIRATION
        value: ${ACCESS_TOKEN_EXPIRATION}
        type: GENERAL
      - key: REFRESH_TOKEN_EXPIRATION
        value: ${REFRESH_TOKEN_EXPIRATION}
        type: GENERAL
      - key: LOG_LEVEL
        value: ${LOG_LEVEL}
        type: GENERAL
      - key: SMTP_LOGIN
        value: ${SMTP_LOGIN}
        type: GENERAL
      - key: PUBLIC_URL
        value: ${PUBLIC_URL}
        type: GENERAL
      - key: DB_SSL
        value: 'true'
        type: GENERAL
      - key: VITE_API_TARGET
        value: ${VITE_API_TARGET}
        type: GENERAL

    instance_count: 1
    health_check:
      http_path: /health
      port: 3000
      initial_delay_seconds: 10
      period_seconds: 60
      failure_threshold: 3
      success_threshold: 2
    alerts:
      - rule: CPU_UTILIZATION
        disabled: false
        operator: GREATER_THAN
        value: 85
        window: FIVE_MINUTES
      - operator: GREATER_THAN
        rule: MEM_UTILIZATION
        value: 85
        window: FIVE_MINUTES

