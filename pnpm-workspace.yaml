strictDepBuilds: true
trustPolicy: off
ignoreScripts: true
ignoreDepScripts: true
packages:
  - 'apps/*'
  - 'packages/*'

onlyBuiltDependencies:
  - sharp

overrides:
  # fast-xml-parser: multiple CVEs, all patched in 5.7.0
  "fast-xml-parser@<5.7.0": ">=5.7.0"
  # react-router: direct dep updated to ^7.17.0; override covers any transitive pinned refs
  "react-router@>=7.0.0 <7.15.0": ">=7.15.0"
  # serialize-javascript: CVE patched in 7.0.5
  "serialize-javascript@<7.0.5": ">=7.0.5"
  # minimatch: CVEs patched in 3.1.4
  "minimatch@<3.1.4": ">=3.1.4"
  "minimatch@>=9.0.0 <9.0.7": ">=9.0.7"
  # lodash/lodash-es: CVEs affect <=4.17.23, patched in 4.18.0
  "lodash@<=4.17.23": ">=4.18.0"
  "lodash-es@<=4.17.23": ">=4.18.0"
  # qs: CVE in 6.11.1-6.15.1, patched in 6.15.2
  "qs@>=6.11.1 <6.15.2": ">=6.15.2"
  # ajv: CVE in 7.x-8.x below 8.18.0, patched in 8.18.0
  "ajv@>=7.0.0-alpha.0 <8.18.0": ">=8.18.0"
  # on-headers: CVE patched in 1.1.0
  "on-headers@<1.1.0": ">=1.1.0"
  # carried-over overrides (were in package.json pnpm field, now moved here)
  "js-yaml@3.14.1": "3.14.2"
  "js-yaml@4.1.0": "4.1.1"
  "brace-expansion@>=1.0.0 <=1.1.11": ">=1.1.12"
  "jws@=4.0.0": ">=4.0.1"
  "@smithy/config-resolver@<4.4.0": ">=4.4.0"
  "diff@<4.0.4": ">=4.0.4"
  "rollup@>=4.0.0 <4.59.0": ">=4.59.0"
  "axios@<1.15.0": ">=1.15.0"
  "multer@<2.1.1": ">=2.1.1"
  "test-exclude@6.0.0>minimatch": "3.1.4"

packageExtensions:
  '@event-driven-io/emmett-postgresql@*':
    dependencies:
      uuid: ^14.0.0
