name: Promote Test to Production

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Enter the version tag that has been validated on test (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write # Needed to create the production release

jobs:
  promote:
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ vars.PUBLIC_URL_PROD }} # Optional: set this repository variable to your prod URL

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      - name: Validate tag exists
        run: |
          TAG="${{ inputs.version_tag }}"
          if ! git tag --list | grep -q "^$TAG$"; then
            echo "❌ Error: Tag '$TAG' does not exist."
            echo "Recent tags:"
            git tag --sort=-version:refname | head -n 20
            exit 1
          fi
          echo "✅ Promoting tag: $TAG"

      - name: Check if production release already exists
        id: check_release
        run: |
          TAG="${{ inputs.version_tag }}"
          if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️  A release for $TAG already exists."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create Production GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          name: Production Release ${{ inputs.version_tag }}
          tag_name: ${{ inputs.version_tag }}
          body: |
            ## Production Deployment - ${{ inputs.version_tag }}

            This version has been promoted to **production** after successful testing and validation.

            ### Deployment Details
            - **Environment**: Production
            - **Version Tag**: ${{ inputs.version_tag }}
            - **Promoted from**: Test environment
            - **Commit**: $(git rev-parse ${{ inputs.version_tag }})

            ### Validation
            - Successfully deployed and validated on test environment
            - Manually promoted by ${{ github.actor }}

            Thank you for using the promotion process!
          draft: false
          prerelease: false # This is the key difference from test
          make_latest: true # Marks this as the "Latest release" on GitHub
          target_commitish: main

      - name: Summary
        run: |
          echo "✅ Promotion complete!"
          echo "📦 Version ${{ inputs.version_tag }} is now released to production"
          if [ "${{ steps.check_release.outputs.exists }}" == "true" ]; then
            echo "ℹ️  Note: A release for this tag already existed (possibly from a previous promotion)"
          else
            echo "🚀 Production deployment should now trigger automatically"
          fi
