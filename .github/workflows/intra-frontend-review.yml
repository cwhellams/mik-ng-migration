name: Intra Frontend review, validation and test
run-name: Intra Frontend review, validation and test triggered by @${{ github.actor }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'apps/admin/**'
      - 'apps/edge/**'
      - 'packages/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'apps/admin/**'
      - 'apps/edge/**'
      - 'packages/**'
      - '.github/workflows/**'

concurrency:
  # PR runs share a group per ref, so a new push supersedes the in-flight run.
  # Push-to-main runs get a group to themselves (`github.run_id`): such a run is
  # the only automated check that ever validates the exact commit landing on
  # main (issue #1184), so if two merges land in quick succession neither may be
  # cancelled — and neither may queue behind the other, which a shared group
  # would do even with cancellation off (and would then cancel the queued run
  # outright once a third merge arrives).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env: # Set environment variables for entire workflow
  NODE_OPTIONS: '--max-old-space-size=8192' # Increase memory limit for Node.js
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      # We must checkout code first as the GH workspace is clean / empty
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint and check error count
        working-directory: apps/frontend
        run: |
          # ESLint exits 1 when it finds problems and 2 when it fails to run at
          # all. Only the former is tolerated here: a linter that cannot start
          # must fail the build rather than be counted as zero errors, which is
          # how linting silently stopped running across this repo (issue #1132).
          npx eslint . --format json > eslint-results.json || ESLINT_EXIT=$?
          if [ "${ESLINT_EXIT:-0}" -gt 1 ]; then
            echo "::error::ESLint failed to run (exit ${ESLINT_EXIT})"
            exit 1
          fi

          if ! jq -e 'type == "array"' eslint-results.json > /dev/null 2>&1; then
            echo "::error::ESLint produced no usable report — treating as a failure"
            exit 1
          fi

          ERROR_COUNT=$(jq '[.[] | .errorCount] | add // 0' eslint-results.json)
          echo "Total ESLint errors: $ERROR_COUNT"

          # Define your threshold. 15 -> 10 -> 7 -> 5 across #1233's ports: each
          # batch of pages that left for apps/admin took some of the backlog
          # with it, and extracting the shared monthly-series helper removed the
          # last two `any`s in Stats.tsx. Ratchets only ever come down, in the
          # PR that earned it.
          THRESHOLD=5

          # Check if error count exceeds threshold
          if [ "$ERROR_COUNT" -gt "$THRESHOLD" ]; then
            echo "ESLint errors ($ERROR_COUNT) exceed threshold ($THRESHOLD)"
            exit 1
          else
            echo "ESLint errors ($ERROR_COUNT) are within acceptable threshold ($THRESHOLD)"
          fi

      - name: Run Prettier Check
        working-directory: apps/frontend
        run: pnpm format:check

      - name: Build frontend
        working-directory: apps/frontend
        run: pnpm run build

      # The coverage ratchet lives in apps/frontend/vitest.config.ts, not here:
      # `coverage.thresholds` is per directory, and Vitest exits non-zero when
      # any of them is missed, so this step is the gate (issue #1116 phase 6).
      # Unlike the ESLint ratchet above there is no threshold to read off in
      # this file — the failure names the directory and the shortfall.
      - name: Run tests with coverage
        working-directory: apps/frontend
        run: pnpm run test:coverage

      # `if: always()` because the report is most wanted on the run that just
      # failed: the threshold error names the directory, the HTML report in here
      # names the lines. Without it a ratchet breach uploads nothing.
      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: apps/frontend/coverage/
          if-no-files-found: ignore

      - name: Check for Security Vulnerabilities
        working-directory: apps/frontend
        run: pnpm audit --audit-level=high || echo "Security issues found with NPM packages"

  build-and-test-ui:
    # @mik/ui is consumed by both apps, so a break here breaks both. It runs as
    # its own job rather than a step in either app's, so the failure names the
    # package. (packages/contracts is the same idea, run from the backend
    # workflow because the backend depends on it too; nothing server-side
    # depends on this one.)
    runs-on: ubuntu-latest
    environment: DEV
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint and check error count
        working-directory: packages/ui
        run: |
          npx eslint . --format json > eslint-results.json || ESLINT_EXIT=$?
          if [ "${ESLINT_EXIT:-0}" -gt 1 ]; then
            echo "::error::ESLint failed to run (exit ${ESLINT_EXIT})"
            exit 1
          fi
          if ! jq -e 'type == "array"' eslint-results.json > /dev/null 2>&1; then
            echo "::error::ESLint produced no usable report — treating as a failure"
            exit 1
          fi
          ERROR_COUNT=$(jq '[.[] | .errorCount] | add // 0' eslint-results.json)
          echo "Total ESLint errors: $ERROR_COUNT"
          # Zero, like packages/contracts: a package extracted from code that
          # already lints clean has no inherited backlog to ratchet down from.
          THRESHOLD=0
          if [ "$ERROR_COUNT" -gt "$THRESHOLD" ]; then
            echo "ESLint errors ($ERROR_COUNT) exceed threshold ($THRESHOLD)"
            exit 1
          fi

      - name: Run Prettier Check
        working-directory: packages/ui
        run: pnpm format:check

      # `build` is a `tsc --noEmit` typecheck: the package ships TS source and
      # both apps' bundlers compile it themselves.
      - name: Typecheck
        working-directory: packages/ui
        run: pnpm run build

      - name: Run tests with coverage
        working-directory: packages/ui
        run: pnpm run test:coverage

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-package-coverage-report
          path: packages/ui/coverage/
          if-no-files-found: ignore

  build-and-test-admin:
    runs-on: ubuntu-latest
    environment: DEV
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint and check error count
        working-directory: apps/admin
        run: |
          npx eslint . --format json > eslint-results.json || ESLINT_EXIT=$?
          if [ "${ESLINT_EXIT:-0}" -gt 1 ]; then
            echo "::error::ESLint failed to run (exit ${ESLINT_EXIT})"
            exit 1
          fi
          if ! jq -e 'type == "array"' eslint-results.json > /dev/null 2>&1; then
            echo "::error::ESLint produced no usable report — treating as a failure"
            exit 1
          fi
          ERROR_COUNT=$(jq '[.[] | .errorCount] | add // 0' eslint-results.json)
          echo "Total ESLint errors: $ERROR_COUNT"
          # New app starts at 0 errors — ratchet starts here, may only go down.
          THRESHOLD=0
          if [ "$ERROR_COUNT" -gt "$THRESHOLD" ]; then
            echo "ESLint errors ($ERROR_COUNT) exceed threshold ($THRESHOLD)"
            exit 1
          fi

      - name: Run Prettier Check
        working-directory: apps/admin
        run: pnpm format:check

      - name: Build admin app
        working-directory: apps/admin
        run: pnpm run build

      - name: Run tests with coverage
        working-directory: apps/admin
        run: pnpm run test:coverage

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-coverage-report
          path: apps/admin/coverage/
          if-no-files-found: ignore

  build-and-test-edge:
    # The Cloudflare edge Worker (apps/edge) sits in front of the built SPA and
    # the API origin, so a break here takes the whole site down even though no
    # application code changed. It runs as its own job for the same reason
    # packages/ui does: the failure should name the package.
    runs-on: ubuntu-latest
    environment: DEV
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Zero, like packages/ui and packages/contracts: a package written from
      # scratch has no inherited backlog to ratchet down from.
      - name: Run ESLint and check error count
        working-directory: apps/edge
        run: |
          npx eslint . --format json > eslint-results.json || ESLINT_EXIT=$?
          if [ "${ESLINT_EXIT:-0}" -gt 1 ]; then
            echo "::error::ESLint failed to run (exit ${ESLINT_EXIT})"
            exit 1
          fi
          if ! jq -e 'type == "array"' eslint-results.json > /dev/null 2>&1; then
            echo "::error::ESLint produced no usable report — treating as a failure"
            exit 1
          fi
          ERROR_COUNT=$(jq '[.[] | .errorCount] | add // 0' eslint-results.json)
          echo "Total ESLint errors: $ERROR_COUNT"
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "ESLint errors ($ERROR_COUNT) exceed threshold (0)"
            exit 1
          fi

      - name: Run Prettier Check
        working-directory: apps/edge
        run: pnpm format:check

      - name: Typecheck
        working-directory: apps/edge
        run: pnpm run typecheck

      - name: Run tests
        working-directory: apps/edge
        run: pnpm test

      # Builds both SPAs for the single-origin topology and assembles them.
      # This is the half the unit tests cannot reach: it is where a wrong Vite
      # base in the admin bundle is caught, and that failure otherwise shows up
      # only as a blank admin page in a browser.
      - name: Assemble the asset bundle
        working-directory: apps/edge
        run: |
          pnpm run assets
          test -f dist/index.html
          test -f dist/admin/index.html
