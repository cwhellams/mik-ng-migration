name: Intra Frontend review, validation and test
run-name: Intra Frontend review, validation and test triggered by @${{ github.actor }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/**'
env: # Set environment variables for entire workflow
  NODE_OPTIONS: '--max-old-space-size=8192' # Increase memory limit for Node.js

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: DEV

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      # We must checkout code first as the GH workspace is clean / empty
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Run ESLint and check error count
        run: |
          # Run ESLint and save output to a file
          npx eslint . --format json > eslint-results.json || true

          # Count the number of errors using jq
          ERROR_COUNT=$(cat eslint-results.json | jq '[.[] | .errorCount] | add // 0')
          echo "Total ESLint errors: $ERROR_COUNT"

          # Define your threshold
          THRESHOLD=15

          # Check if error count exceeds threshold
          if [ $ERROR_COUNT -gt $THRESHOLD ]; then
            echo "ESLint errors ($ERROR_COUNT) exceed threshold ($THRESHOLD)"
            exit 1
          else
            echo "ESLint errors ($ERROR_COUNT) are within acceptable threshold ($THRESHOLD)"
          fi

      - name: Build frontend
        run: pnpm run build

      - name: Check for Security Vulnerabilities
        run: pnpm audit --audit-level=high || echo "Security issues found with NPM packages"
