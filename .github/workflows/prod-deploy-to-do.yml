name: Production Deployment to DO

on:
  repository_dispatch:
    types: [deploy-prod]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    # Extra safety: never deploy prereleases
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: prod
      url: https://intra.mik.fi

    steps:
      - name: Checkout selected tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.tag_name }}
          fetch-depth: 0

      - name: Prepare unique production deploy branch
        run: |
          TAG="${{ github.event.client_payload.tag_name }}"
          DEPLOY_BRANCH="prod-deploy-${TAG}"

          # Create branch from release tag
          git checkout -B "$DEPLOY_BRANCH" $TAG
           
          # Set Git identity for this repo only
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add timestamp to force frontend rebuild
          echo "DEPLOY_TIMESTAMP=$(date +%s)" >> .deploy_timestamp
          git add .deploy_timestamp
          git commit -m "Deploy $TAG - timestamp $(date +%s)"

          # Push branch
          git push origin "$DEPLOY_BRANCH" --force

          echo "DEPLOY_BRANCH=$DEPLOY_BRANCH" >> "$GITHUB_ENV"
          echo "DEPLOY_TIMESTAMP=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set repo name lowercase
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITAL_OCEAN_TEST_API_KEY }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Set environment variables
        run: |
          # Environment Variable Scoping Pattern:
          # Variables are scoped by GitHub environment (prod vs TEST) rather than name suffixes.
          # This workflow runs in the 'prod' environment, so vars.FOO pulls from prod's FOO variable.
          # Secrets with different values per environment use explicit _PROD suffixes for clarity.
          # All other variables use the same name and are differentiated only by environment scope.

          # Backend envs
          # Database and secrets use environment-specific secret names due to different values
          echo "DATABASE_URL=${{ secrets.POSTGRES_DO_URL_PRIVATE_PROD }}" >> $GITHUB_ENV
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD_PROD }}" >> $GITHUB_ENV
          echo "ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET_PROD }}" >> $GITHUB_ENV
          echo "MAGIC_LINK_SECRET=${{ secrets.MAGIC_LINK_SECRET_PROD }}" >> $GITHUB_ENV
          echo "REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET_PROD }}" >> $GITHUB_ENV
          echo "SIMPLBOOKS_API_KEY=${{ secrets.SIMPLBOOKS_API_KEY_PROD }}" >> $GITHUB_ENV
          echo "BREVO_API_KEY=${{ secrets.BREVO_API_KEY_PROD }}" >> $GITHUB_ENV

          # Standard variables - same name in both environments, scoped by GitHub environment
          echo "ACCESS_TOKEN_EXPIRATION=15 mins" >> $GITHUB_ENV
          echo "REFRESH_TOKEN_EXPIRATION=365 days" >> $GITHUB_ENV
          echo "SMTP_LOGIN=${{ vars.SMTP_LOGIN }}" >> $GITHUB_ENV
          echo "PUBLIC_URL=${{ vars.PUBLIC_URL }}" >> $GITHUB_ENV
          echo "VITE_API_TARGET=${{ vars.VITE_API_TARGET }}" >> $GITHUB_ENV
          echo "BETTERSTACK_API_TOKEN=${{ secrets.BETTERSTACK_API_TOKEN }}" >> $GITHUB_ENV
          echo "SIMPLBOOKS_OUTBOX_WORKER_ENABLED=${{ vars.SIMPLBOOKS_OUTBOX_WORKER_ENABLED }}" >> $GITHUB_ENV
          echo "SIMPLBOOKS_COMPANY_ID=${{ vars.SIMPLBOOKS_COMPANY_ID }}" >> $GITHUB_ENV
          echo "SIMPLBOOKS_BASE_URI=${{ vars.SIMPLBOOKS_BASE_URI }}" >> $GITHUB_ENV
          echo "SIMPLBOOKS_INVOICE_PAYMENT_WORKER_ENABLED=${{ vars.SIMPLBOOKS_INVOICE_PAYMENT_WORKER_ENABLED }}" >> $GITHUB_ENV
          echo "SIMPLBOOKS_INVOICE_PAYMENT_WORKER_RUN_ON_STARTUP=${{ vars.SIMPLBOOKS_INVOICE_PAYMENT_WORKER_RUN_ON_STARTUP }}" >> $GITHUB_ENV
          echo "OVERDUE_INVOICE_WORKER_ENABLED=${{ vars.OVERDUE_INVOICE_WORKER_ENABLED }}" >> $GITHUB_ENV
          echo "OVERDUE_INVOICE_WORKER_RUN_ON_STARTUP=${{ vars.OVERDUE_INVOICE_WORKER_RUN_ON_STARTUP }}" >> $GITHUB_ENV
          echo "OVERDUE_INVOICE_SUSPENSION_DAYS=${{ vars.OVERDUE_INVOICE_SUSPENSION_DAYS }}" >> $GITHUB_ENV
          echo "OCCURRENCE_NOTIFICATION_WORKER_ENABLED=${{ vars.OCCURRENCE_NOTIFICATION_WORKER_ENABLED }}" >> $GITHUB_ENV
          echo "DIGITAL_OCEAN_SPACES_KEY=${{ secrets.DIGITAL_OCEAN_SPACES_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "DIGITAL_OCEAN_SPACES_SECRET=${{ secrets.DIGITAL_OCEAN_SPACES_SECRET }}" >> $GITHUB_ENV
          echo "DIGITAL_OCEAN_SPACES_REGION=fra1" >> $GITHUB_ENV
          echo "DIGITAL_OCEAN_SPACES_ENDPOINT=https://fra1.digitaloceanspaces.com" >> $GITHUB_ENV
          echo "EXPENSE_RECEIPT_BUCKET=${{ vars.EXPENSE_RECEIPT_BUCKET }}" >> $GITHUB_ENV
          echo "FIELD_ENCRYPTION_KEY=${{ secrets.FIELD_ENCRYPTION_KEY }}" >> $GITHUB_ENV
          echo "MILEAGE_MAX_KM=${{ vars.MILEAGE_MAX_KM }}" >> $GITHUB_ENV
          echo "BREVO_API_URL=https://api.brevo.com/v3" >> $GITHUB_ENV
          echo "AIRCRAFT_MAILING_LISTS=${{ vars.AIRCRAFT_MAILING_LISTS }}" >> $GITHUB_ENV
          echo "BREVO_SYNC_WORKER_ENABLED=${{ vars.BREVO_SYNC_WORKER_ENABLED }}" >> $GITHUB_ENV
          echo "BREVO_SYNC_WORKER_RUN_ON_STARTUP=${{ vars.BREVO_SYNC_WORKER_RUN_ON_STARTUP }}" >> $GITHUB_ENV
          echo "EQUIPMENT_FEE_DISCOUNT_PER_HOUR=${{ vars.EQUIPMENT_FEE_DISCOUNT_PER_HOUR }}" >> $GITHUB_ENV
          echo "CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}" >> $GITHUB_ENV
          echo "DO_MIK_VPC_UUID=${{ vars.DO_MIK_VPC_UUID }}" >> $GITHUB_ENV
          echo "WEATHER_API_BASE_URL=${{ vars.WEATHER_API_BASE_URL }}" >> $GITHUB_ENV
          echo "WEATHER_AUDIO_BASE_URL=${{ vars.WEATHER_AUDIO_BASE_URL }}" >> $GITHUB_ENV
          echo "SIMPLBOOKS_MEMBER_SYNC_ENABLED=${{ vars.SIMPLBOOKS_MEMBER_SYNC_ENABLED }}" >> $GITHUB_ENV
          echo "SIMPLBOOKS_MEMBER_SYNC_RUN_ON_STARTUP=${{ vars.SIMPLBOOKS_MEMBER_SYNC_RUN_ON_STARTUP }}" >> $GITHUB_ENV
          echo "OVERDUE_INVOICE_GRACE_PERIOD_DAYS=${{ vars.OVERDUE_INVOICE_GRACE_PERIOD_DAYS }}" >> "$GITHUB_ENV"
          echo "KALUSTO_EMAIL=${{ vars.KALUSTO_EMAIL }}" >> "$GITHUB_ENV"
          echo "AIRCRAFT_DOCUMENT_EXPIRY_WORKER_ENABLED=${{ vars.AIRCRAFT_DOCUMENT_EXPIRY_WORKER_ENABLED }}" >> "$GITHUB_ENV"
          echo "AIRCRAFT_DOCUMENT_EXPIRY_WORKER_RUN_ON_STARTUP=${{ vars.AIRCRAFT_DOCUMENT_EXPIRY_WORKER_RUN_ON_STARTUP }}" >> "$GITHUB_ENV"
          echo "AIRCRAFT_DOCUMENT_EXPIRY_REMINDER_DAYS=${{ vars.AIRCRAFT_DOCUMENT_EXPIRY_REMINDER_DAYS }}" >> "$GITHUB_ENV"
          echo "PUSH_NOTIFICATION_WORKER_ENABLED=${{ vars.PUSH_NOTIFICATION_WORKER_ENABLED }}" >> "$GITHUB_ENV"
          echo "PUSH_NOTIFICATION_HOURS_BEFORE=${{ vars.PUSH_NOTIFICATION_HOURS_BEFORE }}" >> "$GITHUB_ENV"
          echo "VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}" >> "$GITHUB_ENV"
          echo "VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}" >> "$GITHUB_ENV"
          echo "VAPID_SUBJECT=${{ vars.VAPID_SUBJECT }}" >> "$GITHUB_ENV"
          echo "VITE_TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}" >> "$GITHUB_ENV"
          echo "TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}" >> "$GITHUB_ENV"
          echo "DOCUMENT_URL_TTL_SECS=${{ vars.DOCUMENT_URL_TTL_SECS }}" >> "$GITHUB_ENV"
          echo "TINY_URL_BASE_URL=${{ vars.TINY_URL_BASE_URL }}" >> "$GITHUB_ENV"
          echo "MIK_LOGO_PATH=/home/node/app/apps/backend/src/assets/mik-logo-blue.png" >> "$GITHUB_ENV"
          echo "SIMPLBOOKS_CREDIT_NOTE_INCOME_ACCT_ID=${{ vars.SIMPLBOOKS_CREDIT_NOTE_INCOME_ACCT_ID }}" >> "$GITHUB_ENV"
          echo "MEDICAL_CHECK_ENABLED=${{ vars.MEDICAL_CHECK_ENABLED }}" >> "$GITHUB_ENV"
          echo "TINY_URL_CLEANUP_WORKER_ENABLED=${{ vars.TINY_URL_CLEANUP_WORKER_ENABLED }}" >> "$GITHUB_ENV"
          echo "TINY_URL_CLEANUP_WORKER_RUN_ON_STARTUP=${{ vars.TINY_URL_CLEANUP_WORKER_RUN_ON_STARTUP }}" >> "$GITHUB_ENV"
          echo "MAILBOX_CLEANUP_WORKER_ENABLED=${{ vars.MAILBOX_CLEANUP_WORKER_ENABLED }}" >> "$GITHUB_ENV"
          echo "MAILBOX_CLEANUP_WORKER_RUN_ON_STARTUP=${{ vars.MAILBOX_CLEANUP_WORKER_RUN_ON_STARTUP }}" >> "$GITHUB_ENV"
          echo "QUALIFICATION_EXPIRY_WORKER_ENABLED=${{ vars.QUALIFICATION_EXPIRY_WORKER_ENABLED }}" >> "$GITHUB_ENV"
          echo "QUALIFICATION_EXPIRY_WORKER_RUN_ON_STARTUP=${{ vars.QUALIFICATION_EXPIRY_WORKER_RUN_ON_STARTUP }}" >> "$GITHUB_ENV"
          echo "QUALIFICATION_EXPIRY_REMINDER_DAYS=${{ vars.QUALIFICATION_EXPIRY_REMINDER_DAYS }}" >> "$GITHUB_ENV"
          echo "MILEAGE_HETU_PURGE_WORKER_ENABLED=${{ vars.MILEAGE_HETU_PURGE_WORKER_ENABLED }}" >> "$GITHUB_ENV"
          echo "MILEAGE_HETU_PURGE_WORKER_RUN_ON_STARTUP=${{ vars.MILEAGE_HETU_PURGE_WORKER_RUN_ON_STARTUP }}" >> "$GITHUB_ENV"
          echo "BOOKING_REMINDER_WORKER_ENABLED=${{ vars.BOOKING_REMINDER_WORKER_ENABLED }}" >> "$GITHUB_ENV"
          echo "BOOKING_REMINDER_HOURS_BEFORE=${{ vars.BOOKING_REMINDER_HOURS_BEFORE }}" >> "$GITHUB_ENV"
          echo "JUNIOR_PROMOTION_WORKER_ENABLED=${{ vars.JUNIOR_PROMOTION_WORKER_ENABLED }}" >> "$GITHUB_ENV"
          echo "JUNIOR_PROMOTION_WORKER_RUN_ON_STARTUP=${{ vars.JUNIOR_PROMOTION_WORKER_RUN_ON_STARTUP }}" >> "$GITHUB_ENV"
          echo "NOMINATIM_BASE_URL=${{ vars.NOMINATIM_BASE_URL }}" >> "$GITHUB_ENV"
          echo "NOMINATIM_USER_AGENT=${{ vars.NOMINATIM_USER_AGENT }}" >> "$GITHUB_ENV"
          echo "OSRM_BASE_URL=${{ vars.OSRM_BASE_URL }}" >> "$GITHUB_ENV"
          echo "ORDER_NOTIFICATION_EMAIL=${{ vars.ORDER_NOTIFICATION_EMAIL }}" >> "$GITHUB_ENV"

      - name: Validate required environment-scoped variables
        run: |
          # Fail fast if a variable migrated from the _PROD suffix pattern to
          # GitHub-environment scoping resolved empty — better than deploying
          # with e.g. CORS rejecting every request or outbound email silently failing.
          REQUIRED_VARS="SMTP_LOGIN PUBLIC_URL VITE_API_TARGET SIMPLBOOKS_OUTBOX_WORKER_ENABLED SIMPLBOOKS_COMPANY_ID SIMPLBOOKS_BASE_URI SIMPLBOOKS_INVOICE_PAYMENT_WORKER_ENABLED SIMPLBOOKS_INVOICE_PAYMENT_WORKER_RUN_ON_STARTUP OVERDUE_INVOICE_WORKER_ENABLED OVERDUE_INVOICE_WORKER_RUN_ON_STARTUP OVERDUE_INVOICE_SUSPENSION_DAYS OCCURRENCE_NOTIFICATION_WORKER_ENABLED EXPENSE_RECEIPT_BUCKET AIRCRAFT_MAILING_LISTS BREVO_SYNC_WORKER_ENABLED BREVO_SYNC_WORKER_RUN_ON_STARTUP CORS_ALLOWED_ORIGINS TINY_URL_BASE_URL TINY_URL_CLEANUP_WORKER_ENABLED TINY_URL_CLEANUP_WORKER_RUN_ON_STARTUP MAILBOX_CLEANUP_WORKER_ENABLED MAILBOX_CLEANUP_WORKER_RUN_ON_STARTUP"
          MISSING=""
          for VAR_NAME in $REQUIRED_VARS; do
            VALUE="${!VAR_NAME}"
            if [ -z "$VALUE" ]; then
              MISSING="$MISSING $VAR_NAME"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::The following variables resolved empty — check the 'prod' GitHub Environment configuration:$MISSING"
            exit 1
          fi

      - name: Promote image to production
        run: |
          IMAGE="registry.digitalocean.com/mik-ng2/${{ env.REPO_NAME }}"
          TAG="${{ github.event.client_payload.tag_name }}"
          # Pull the exact versioned image built and validated during the test deployment.
          # No rebuild — the same binary that was tested is promoted to prod.
          docker pull "${IMAGE}:${TAG}"
          docker tag "${IMAGE}:${TAG}" "${IMAGE}:prod"
          docker push "${IMAGE}:prod"

      - name: Get runner public IP
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"

      - name: Add runner IP to database firewall
        run: |
          doctl databases firewalls append ${{ vars.DO_POSTGRES_CLUSTER_ID_FRA1 }} --rule ip_addr:${{ env.RUNNER_IP }}
          RULE_UUID=$(doctl databases firewalls list ${{ vars.DO_POSTGRES_CLUSTER_ID_FRA1 }} --output json | jq -r '.[] | select(.value=="'${{ env.RUNNER_IP }}'") | .uuid')
          echo "FIREWALL_RULE_UUID=$RULE_UUID" >> "$GITHUB_ENV"
      - name: Run Flyway migrations
        run: |
          docker run --network host --rm \
            -v ${{ github.workspace }}/sql/schema/migration:/flyway/sql \
            -v ${{ github.workspace }}/sql/migration_prod.conf:/flyway/conf/flyway.conf \
            -e FLYWAY_USER=${{ vars.DO_POSTGRES_ADMIN_USER }} \
            -e FLYWAY_PASSWORD=${{ secrets.DO_POSTGRES_ADMIN_PASSWORD}} \
            -e FLYWAY_URL=jdbc:postgresql://${{ vars.DO_POSTGRES_PUBLIC_URL_PROD}} \
            -e FLYWAY_PLACEHOLDER_REPLACEMENT=true \
            flyway/flyway:latest migrate

      - name: Run Flyway static data
        run: |
          docker run --network host --rm \
            -v ${{ github.workspace }}/sql/schema/static_data/:/flyway/sql \
            -v ${{ github.workspace }}/sql/staticdata_prod.conf:/flyway/conf/flyway.conf \
            -e FLYWAY_USER=${{ vars.DO_POSTGRES_ADMIN_USER }} \
            -e FLYWAY_PASSWORD=${{ secrets.DO_POSTGRES_ADMIN_PASSWORD }} \
            -e FLYWAY_URL=jdbc:postgresql://${{ vars.DO_POSTGRES_PUBLIC_URL_PROD}} \
            flyway/flyway:latest migrate

      - name: Remove runner IP from database firewall
        run: |
          [ -n "${{ env.FIREWALL_RULE_UUID }}" ] && \
          doctl databases firewalls remove ${{ vars.DO_POSTGRES_CLUSTER_ID_FRA1 }} --uuid ${{ env.FIREWALL_RULE_UUID }}

      - name: Replace placeholders in mik-intranet.yaml
        run: |
          export DOMAIN=$(echo "${{ vars.PUBLIC_URL }}" | sed 's|https\?://||')
          export IMAGE_TAG="${{ github.event.client_payload.tag_name }}"
          # envsubst does raw text substitution with no awareness of YAML quoting,
          # so a secret containing a literal ' breaks the single-quoted `value: '${VAR}'`
          # entries and doctl fails with "did not find expected key". Substitute with
          # perl instead, doubling any ' in the substituted value per YAML's
          # single-quote escaping rule so the result always parses.
          perl -pe 's/\$\{([A-Za-z_][A-Za-z0-9_]*)\}/my $v = $ENV{$1} \/\/ ""; $v =~ s{\x27}{\x27\x27}g; $v/ge' .do/mik-intranet-prod.yaml > .do/mik-intranet-prod.yaml.temp
          mv .do/mik-intranet-prod.yaml.temp .do/mik-intranet-prod.yaml

      - name: Validate substituted DO app spec
        run: ruby scripts/validate_do_spec.rb .do/mik-intranet-prod.yaml

      - name: Update app on DigitalOcean
        run: doctl apps update ${{ vars.DO_BACKEND_APP_ID_PROD }} --spec .do/mik-intranet-prod.yaml --wait
