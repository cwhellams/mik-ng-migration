name: Build and Deploy Backup Job

on:
    push:
        branches:
            - prod
        paths:
            - "ops/backup/**"
            - ".github/workflows/deploy-backup-job.yml"
            - ".do/pg-backup-job.yaml"
    workflow_dispatch:

env:
    REGISTRY: registry.digitalocean.com
    IMAGE_NAME: postgres-backup-job

jobs:
    build_and_push:
        runs-on: ubuntu-latest
        env:
            GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
            GHCR_PASSWORD: ${{ secrets.GHCR_READ_TOKEN }}
            DO_POSTGRES_USER: ${{ vars.DO_POSTGRES_USER }}
            DO_POSTGRES_PASSWORD: ${{ secrets.DO_POSTGRES_PASSWORD }}
            DO_POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
            DO_POSTGRES_URL: ${{ vars.DO_POSTGRES_URL }}
            CLOUDFLARE_R2_ACCESSKEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESSKEY_ID }}
            CLOUDFLARE_R2_SECRET_ACCESSKEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESSKEY }}
            CLOUDFLARE_R2_EU_ENDPOINT: ${{ vars.CLOUDFLARE_R2_EU_ENDPOINT }}
            CLOUDFLARE_R2_BUCKET_NAME_DB_BACKUP: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME_DB_BACKUP }}
            BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set image tag
              run: |
                  echo "IMAGE_TAG=ghcr.io/${GITHUB_REPOSITORY,,}-backup-job:latest" >> $GITHUB_ENV

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
                  # Use pipeline tokens here as we are pushing to GHCR

            - name: Build and push Docker image
              id: build-image
              uses: docker/build-push-action@v2
              with:
                  context: ops/backup
                  push: true
                  tags: ${{ env.IMAGE_TAG }}

            - name: Install doctl
              uses: digitalocean/action-doctl@v2
              with:
                  token: ${{ secrets.DIGITAL_OCEAN_TEST_API_KEY }}

            # - name: Check if app exists and create if needed
            #   env:
            #       BACKUP_IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
            #       GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
            #       GHCR_PASSWORD: ${{ secrets.GHCR_READ_TOKEN }}
            #       DO_POSTGRES_USER: ${{ vars.DO_POSTGRES_USER }}
            #       DO_POSTGRES_PASSWORD: ${{ secrets.DO_POSTGRES_PASSWORD }}
            #       DO_POSTGRES_URL: ${{ vars.DO_POSTGRES_URL }}
            #       DO_POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
            #       CLOUDFLARE_R2_ACCESSKEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESSKEY_ID }}
            #       CLOUDFLARE_R2_SECRET_ACCESSKEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESSKEY }}
            #       CLOUDFLARE_R2_EU_ENDPOINT: ${{ vars.CLOUDFLARE_R2_EU_ENDPOINT }}
            #       CLOUDFLARE_R2_BUCKET_NAME_DB_BACKUP: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME_DB_BACKUP }}
            #       BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
            #   run: |
            #       if ! doctl apps list --format Name --no-header | grep -q "^postgres-backup-app$"; then
            #         echo "App does not exist, creating..."
            #         envsubst < .do/pg-backup-job.yaml > /tmp/pg-backup-job.yaml
            #         doctl apps create --spec /tmp/pg-backup-job.yaml --wait
            #       else
            #         echo "App exists, will update in next step"
            #       fi

            - name: Deploy to DigitalOcean App Platform
              env:
                  BACKUP_IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
                  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
                  GHCR_PASSWORD: ${{ secrets.GHCR_READ_TOKEN }}
                  DO_POSTGRES_USER: ${{ vars.DO_POSTGRES_USER }}
                  DO_POSTGRES_PASSWORD: ${{ secrets.DO_POSTGRES_PASSWORD }}
                  DO_POSTGRES_URL: ${{ vars.DO_POSTGRES_URL }}
                  DO_POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
                  CLOUDFLARE_R2_ACCESSKEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESSKEY_ID }}
                  CLOUDFLARE_R2_SECRET_ACCESSKEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESSKEY }}
                  CLOUDFLARE_R2_EU_ENDPOINT: ${{ vars.CLOUDFLARE_R2_EU_ENDPOINT }}
                  CLOUDFLARE_R2_BUCKET_NAME_DB_BACKUP: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME_DB_BACKUP }}
                  BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
              run: |
                  envsubst < .do/pg-backup-job.yaml > /tmp/pg-backup-job.yaml
                  doctl apps update 0fa7a272-146b-4ea8-9cc5-a7404e770d04 --spec /tmp/pg-backup-job.yaml --wait
