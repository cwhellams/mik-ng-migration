name: Promote Pre-release to Production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Pre-release tag to promote (e.g. v1.4.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Find prerelease by tag
        env:
          TAG: ${{ github.event.inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          echo "🔍 Searching for release with tag: $TAG"

          RELEASE_JSON=$(gh api repos/$REPO/releases --paginate)

          MATCH=$(echo "$RELEASE_JSON" | jq -c ".[] | select(.tag_name == \"$TAG\")")

          if [ -z "$MATCH" ]; then
            echo "❌ No release found for tag $TAG"
            exit 1
          fi

          IS_PRERELEASE=$(echo "$MATCH" | jq -r '.prerelease')
          RELEASE_ID=$(echo "$MATCH" | jq -r '.id')

          if [ "$IS_PRERELEASE" != "true" ]; then
            echo "❌ Release $TAG is not a prerelease"
            exit 1
          fi

          echo "✅ Prerelease found (ID: $RELEASE_ID)"
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV

      - name: Promote prerelease to full release
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.release_tag }}

        run: |
          set -e
          echo "🚀 Promoting prerelease to production release"

          gh api \
            -X PATCH \
            repos/$REPO/releases/${{ env.RELEASE_ID }} \
            -f prerelease=false

          echo "✅ Release promoted successfully"

          # Trigger production deploy via repository_dispatch
          gh api repos/$REPO/dispatches \
            -f event_type=deploy-prod \
            -f client_payload="$(jq -n --arg tag "$TAG" '{"tag":$tag}')"
          echo "✅ Repository dispatch sent to trigger prod deploy"

      - name: Summary
        run: |
          echo "🎉 Promotion complete, deployment triggered"
          echo "Tag: ${{ github.event.inputs.release_tag }}"
          echo "➡️ Production deployment triggered automatically"
