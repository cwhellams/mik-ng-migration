name: Promote Pre-release to Production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Pre-release tag to promote (e.g. v1.4.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Find prerelease by tag
        env:
          TAG: ${{ github.event.inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          echo "🔍 Searching for release with tag: $TAG"

          RELEASE_JSON=$(gh api repos/$REPO/releases --paginate)

          MATCH=$(echo "$RELEASE_JSON" | jq -c ".[] | select(.tag_name == \"$TAG\")")

          if [ -z "$MATCH" ]; then
            echo "❌ No release found for tag $TAG"
            exit 1
          fi

          IS_PRERELEASE=$(echo "$MATCH" | jq -r '.prerelease')
          RELEASE_ID=$(echo "$MATCH" | jq -r '.id')

          if [ "$IS_PRERELEASE" != "true" ]; then
            echo "❌ Release $TAG is not a prerelease"
            exit 1
          fi

          echo "✅ Prerelease found (ID: $RELEASE_ID)"
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV

      - name: Update release for production
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          prerelease: false
          name: Release ${{ github.event.inputs.release_tag }}
          body: |
            ## Production Release - ${{ github.event.inputs.release_tag }}

            This version has been deployed to production.

            ### Deployment Details
            - **Environment**: Prod
            - **Version Tag**: ${{ inputs.version_tag }}
            - **Created from**: main branch
            - **Commit**: $(git rev-parse ${{ inputs.version_tag }})

            ### Next Steps
            - Deployment to prod will be triggered automatically            

            ### Changes
            See commits included in this tag.

      - name: Trigger production deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ github.token }}
          event-type: deploy-prod
          client-payload: |
            {
              "tag_name": "${{ github.event.inputs.release_tag }}"
            }
      - name: Summary
        run: |
          echo "🎉 Promotion complete, deployment triggered"
          echo "Tag: ${{ github.event.inputs.release_tag }}"
          echo "➡️ Production deployment triggered automatically"
