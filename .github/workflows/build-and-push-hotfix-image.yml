name: Build and Push Hotfix Image

# Temporary, branch-local workflow. Builds and pushes the Docker image for a
# given tag WITHOUT touching the TEST DigitalOcean app, its database, or its
# app spec — unlike create-test-release-and-deploy-to-do.yml, which bundles
# those together. Used to backfill the image for a hotfix tag that was
# deliberately promoted straight to production, skipping the TEST deploy
# because that tag's app spec/migrations are older than what TEST already
# has deployed. Safe to delete once no longer needed.

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Git tag to build and push (e.g. v1.1.900)'
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version_tag }}
          fetch-depth: 0

      - name: Set repo name lowercase
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITAL_OCEAN_TEST_API_KEY }}
          version: 1.166.0

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push Docker image
        run: |
          IMAGE="registry.digitalocean.com/mik-ng2/${{ env.REPO_NAME }}"
          TAG="${{ inputs.version_tag }}"
          docker build -t "${IMAGE}:${TAG}" .
          docker push "${IMAGE}:${TAG}"
