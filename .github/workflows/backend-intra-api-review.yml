name: Backend intra API review, validation and test
run-name: Backend intra API review, validation and test triggered by @${{ github.actor }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - 'sql/schema/**'
      - '.github/workflows/**'
      - '.do/**' # or in digital ocean yaml
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - 'sql/schema/**'
      - '.github/workflows/**'

concurrency:
  # PR runs share a group per ref, so a new push supersedes the in-flight run.
  # Push-to-main runs get a group to themselves (`github.run_id`): such a run is
  # the only automated check that ever validates the exact commit landing on
  # main (issue #1184), so if two merges land in quick succession neither may be
  # cancelled — and neither may queue behind the other, which a shared group
  # would do even with cancellation off (and would then cancel the queued run
  # outright once a third merge arrives).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env: # Set environment variables for entire workflow
  NODE_OPTIONS: '--max-old-space-size=8192' # Increase memory limit for Node.js
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POSTGRES_DB: mik_ng
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'admin' }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_password' }}
  VITE_API_TARGET: ${{ vars.VITE_API_TARGET }}
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: DEV

    services:
      postgres:
        image: postgres:latest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_PORT: ${{ env.POSTGRES_PORT }}
          POSTGRES_INITDB_ARGS: '--locale-provider=libc --locale=en_US.UTF-8'

    steps:
      # We must checkout code first as the GH workspace is clean / empty
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Run Flyway DB setup
        run: |
          docker run --network host --rm \
            -v ${{ github.workspace }}/sql/database:/flyway/sql \
            -v ${{ github.workspace }}/sql/database.conf:/flyway/conf/flyway.conf \
            -e FLYWAY_USER=${{ env.POSTGRES_USER }} \
            -e FLYWAY_PASSWORD=${{ env.POSTGRES_PASSWORD }} \
            -e FLYWAY_URL=jdbc:postgresql://localhost:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_DB }} \
            flyway/flyway:latest migrate
      - name: Run Flyway migrations
        run: |
          docker run --network host --rm \
            -v ${{ github.workspace }}/sql/schema/migration:/flyway/sql \
            -v ${{ github.workspace }}/sql/migration.conf:/flyway/conf/flyway.conf \
            -e FLYWAY_USER=${{ env.POSTGRES_USER }} \
            -e FLYWAY_PASSWORD=${{ env.POSTGRES_PASSWORD }} \
            -e FLYWAY_URL=jdbc:postgresql://localhost:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_DB }} \
            flyway/flyway:latest migrate

      - name: Run Flyway test data
        run: |
          docker run --network host --rm \
            -v ${{ github.workspace }}/sql/schema/testdata/:/flyway/sql \
            -v ${{ github.workspace }}/sql/testdata.conf:/flyway/conf/flyway.conf \
            -e FLYWAY_USER=${{ env.POSTGRES_USER }} \
            -e FLYWAY_PASSWORD=${{ env.POSTGRES_PASSWORD }} \
            -e FLYWAY_URL=jdbc:postgresql://localhost:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_DB }} \
            flyway/flyway:latest migrate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # @mik/contracts is new in this repo, so unlike the two apps it has no
      # inherited backlog: any error fails the build. Its own suite runs here
      # rather than in either app's — both depend on it, so neither owns it.
      - name: Lint, format-check, typecheck and test @mik/contracts
        working-directory: packages/contracts
        run: |
          npx eslint .
          pnpm format:check
          pnpm build
          pnpm test

      - name: Run ESLint and check error count
        working-directory: apps/backend
        run: |
          # ESLint exits 1 when it finds problems and 2 when it fails to run at
          # all. Only the former is tolerated here: a linter that cannot start
          # must fail the build rather than be counted as zero errors, which is
          # how linting silently stopped running across this repo (issue #1132).
          npx eslint . --format json > eslint-results.json || ESLINT_EXIT=$?
          if [ "${ESLINT_EXIT:-0}" -gt 1 ]; then
            echo "::error::ESLint failed to run (exit ${ESLINT_EXIT})"
            exit 1
          fi

          if ! jq -e 'type == "array"' eslint-results.json > /dev/null 2>&1; then
            echo "::error::ESLint produced no usable report — treating as a failure"
            exit 1
          fi

          ERROR_COUNT=$(jq '[.[] | .errorCount] | add // 0' eslint-results.json)
          echo "Total ESLint errors: $ERROR_COUNT"

          # Ratchet, not a target. Linting had been crashing repo-wide, so this
          # step reported zero errors for months while 96 accumulated (issue
          # #1132). This holds the line at today's real count — it may only ever
          # be lowered. Most of the remainder is @typescript-eslint/no-floating-promises.
          # 96 -> 83: the worker factory (#1115 phase 1) collapsed thirteen
          # copies of an unawaited scheduledTask.stop() into one.
          # 83 -> 81: the models moved to packages/contracts (#1115 phase 4),
          # which is gated at zero errors by its own step above.
          # 81 -> 80: the sanitizers test moved to packages/contracts with them,
          # where zero tolerance forced its useless-escape to be fixed properly.
          # 80 -> 79: getAirfields lost an unused parameter (#1165 review).
          THRESHOLD=79

          # Check if error count exceeds threshold
          if [ "$ERROR_COUNT" -gt "$THRESHOLD" ]; then
            echo "ESLint errors ($ERROR_COUNT) exceed threshold ($THRESHOLD)"
            exit 1
          else
            echo "ESLint errors ($ERROR_COUNT) are within acceptable threshold ($THRESHOLD)"
          fi

      - name: Run Prettier Check
        working-directory: apps/backend
        run: pnpm format:check

      - name: Build backend
        working-directory: apps/backend
        run: pnpm build

      # The production image is otherwise only ever built at release time
      # (create-test-release-and-deploy-to-do.yml), so a Dockerfile mistake shows up
      # after merge, in the deploy. Build it here instead.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mik-ng-backend:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `docker build` on its own would still pass with a workspace package's src/
      # left out of the image entirely — nothing executes at build time, and the
      # failure only appears when the container starts. This starts it far enough
      # to prove the packages/* the backend imports actually resolve in there.
      - name: Verify workspace packages resolve inside the image
        run: |
          docker run --rm --entrypoint node mik-ng-backend:pr-check \
            --import tsx -e "
              Promise.all([
                import('@mik/contracts/members'),
                import('@mik/contracts/calendar'),
                import('@mik/contracts/schema'),
              ]).then(([members]) => {
                if (!members.MIKPermissions) throw new Error('contracts loaded but empty')
                console.log('@mik/contracts resolves inside the image')
              }).catch((err) => { console.error(err); process.exit(1) })
            "

      - name: Check for Security Vulnerabilities
        working-directory: apps/backend
        run: pnpm audit --audit-level=high || echo "Security issues found with NPM packages"
      - name: Test backend
        working-directory: apps/backend
        env:
          SMTP_LOGIN: ${{ vars.SMTP_LOGIN }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SIMPLBOOKS_API_KEY: ${{ secrets.SIMPLBOOKS_API_KEY }}
          SIMPLBOOKS_BASE_URI: ${{ vars.SIMPLBOOKS_BASE_URI }}
          SIMPLBOOKS_COMPANY_ID: ${{ vars.SIMPLBOOKS_COMPANY_ID }}
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
          DATABASE_URL: postgres://mik_app_test:test_pwd@localhost:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_DB }}
          BREVO_API_URL: https://api.brevo.com/v3
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          AIRCRAFT_MAILING_LISTS: ${{ vars.AIRCRAFT_MAILING_LISTS }}
          BREVO_SYNC_WORKER_ENABLED: false
          NODE_ENV: test
        run: |
          pnpm test

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: apps/backend/coverage/
          if-no-files-found: ignore
