name: Backend intra API review, validation and test
run-name: Backend intra API review, validation and test triggered by @${{ github.actor }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'sql/schema/**'
      - '.github/workflows/**'
      - '.do/**' # or in digital ocean yaml
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'sql/schema/**'
      - '.github/workflows/**'
env: # Set environment variables for entire workflow
  NODE_OPTIONS: '--max-old-space-size=8192' # Increase memory limit for Node.js
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POSTGRES_DB: mik_ng
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'admin' }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_password' }}
  VITE_API_TARGET: ${{ vars.VITE_API_TARGET }}
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: DEV

    services:
      postgres:
        image: postgres:latest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_PORT: ${{ env.POSTGRES_PORT }}
          POSTGRES_INITDB_ARGS: '--locale-provider=libc --locale=en_US.UTF-8'

    steps:
      # We must checkout code first as the GH workspace is clean / empty
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Run Flyway DB setup
        run: |
          docker run --network host --rm \
            -v ${{ github.workspace }}/sql/database:/flyway/sql \
            -v ${{ github.workspace }}/sql/database.conf:/flyway/conf/flyway.conf \
            -e FLYWAY_USER=${{ env.POSTGRES_USER }} \
            -e FLYWAY_PASSWORD=${{ env.POSTGRES_PASSWORD }} \
            -e FLYWAY_URL=jdbc:postgresql://localhost:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_DB }} \
            flyway/flyway:latest migrate
      - name: Run Flyway migrations
        run: |
          docker run --network host --rm \
            -v ${{ github.workspace }}/sql/schema/migration:/flyway/sql \
            -v ${{ github.workspace }}/sql/migration.conf:/flyway/conf/flyway.conf \
            -e FLYWAY_USER=${{ env.POSTGRES_USER }} \
            -e FLYWAY_PASSWORD=${{ env.POSTGRES_PASSWORD }} \
            -e FLYWAY_URL=jdbc:postgresql://localhost:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_DB }} \
            flyway/flyway:latest migrate

      - name: Run Flyway test data
        run: |
          docker run --network host --rm \
            -v ${{ github.workspace }}/sql/schema/testdata/:/flyway/sql \
            -v ${{ github.workspace }}/sql/testdata.conf:/flyway/conf/flyway.conf \
            -e FLYWAY_USER=${{ env.POSTGRES_USER }} \
            -e FLYWAY_PASSWORD=${{ env.POSTGRES_PASSWORD }} \
            -e FLYWAY_URL=jdbc:postgresql://localhost:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_DB }} \
            flyway/flyway:latest migrate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint and check error count
        working-directory: apps/backend
        run: |
          # Run ESLint and save output to a file
          npx eslint . --format json > eslint-results.json || true

          # Count the number of errors using jq
          ERROR_COUNT=$(cat eslint-results.json | jq '[.[] | .errorCount] | add // 0')
          echo "Total ESLint errors: $ERROR_COUNT"

          # Define your threshold
          THRESHOLD=15

          # Check if error count exceeds threshold
          if [ $ERROR_COUNT -gt $THRESHOLD ]; then
            echo "ESLint errors ($ERROR_COUNT) exceed threshold ($THRESHOLD)"
            exit 1
          else
            echo "ESLint errors ($ERROR_COUNT) are within acceptable threshold ($THRESHOLD)"
          fi

      - name: Run Prettier Check
        working-directory: apps/backend
        run: pnpm format:check

      - name: Build backend
        working-directory: apps/backend
        run: pnpm build

      - name: Check for Security Vulnerabilities
        working-directory: apps/backend
        run: pnpm audit --audit-level=high || echo "Security issues found with NPM packages"
      - name: Test backend
        working-directory: apps/backend
        env:
          SMTP_LOGIN: ${{ vars.SMTP_LOGIN }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SIMPLBOOKS_API_KEY: ${{ secrets.SIMPLBOOKS_API_KEY }}
          SIMPLBOOKS_BASE_URI: ${{ vars.SIMPLBOOKS_BASE_URI }}
          SIMPLBOOKS_COMPANY_ID: ${{ vars.SIMPLBOOKS_COMPANY_ID }}
          DATABASE_URL: postgres://mik_app_test:test_pwd@localhost:${{ env.POSTGRES_PORT }}/${{ env.POSTGRES_DB }}
          BREVO_API_URL: https://api.brevo.com/v3
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          AIRCRAFT_MAILING_LISTS: ${{ vars.AIRCRAFT_MAILING_LISTS }}
          BREVO_SYNC_WORKER_ENABLED: false
          NODE_ENV: test
        run: |
          pnpm test

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: apps/backend/coverage/
          if-no-files-found: ignore
