name: Production Deployment to DO

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Select version tag to deploy"
        required: true
        type: string
      allow_older_version:
        description: "Allow deploying an older version than the latest tag"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      version_tag: ${{ steps.check.outputs.version_tag }}
      is_manual: ${{ steps.check.outputs.is_manual }}
    steps:
      - name: Determine deployment trigger
        id: check
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            # Release trigger - only deploy non-prerelease (production releases)
            if [ "${{ github.event.release.prerelease }}" == "false" ]; then
              echo "should_deploy=true" >> $GITHUB_OUTPUT
              echo "version_tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
              echo "is_manual=false" >> $GITHUB_OUTPUT
              echo "✅ Production release detected - will deploy"
            else
              echo "should_deploy=false" >> $GITHUB_OUTPUT
              echo "⏭️  Pre-release detected - skipping production deployment"
            fi
          else
            # Manual workflow_dispatch trigger
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "version_tag=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
            echo "is_manual=true" >> $GITHUB_OUTPUT
            echo "✅ Manual deployment trigger"
          fi

  validate-tag:
    needs: check-trigger
    if: needs.check-trigger.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.extract_tag.outputs.tag_name }}
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-trigger.outputs.version_tag }}
          fetch-depth: 0

      - name: Extract and validate semantic version tag
        id: extract_tag
        run: |
          TAG_NAME="${{ needs.check-trigger.outputs.version_tag }}"
          echo "Tag name: $TAG_NAME"

          # Validate tag format (vX.Y.Z where X, Y, Z are numbers)
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag must follow semantic versioning format (vX.Y.Z)"
            echo "Example: v1.0.0, v2.1.3"
            exit 1
          fi

          # Verify tag exists
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Error: Tag '$TAG_NAME' does not exist"
            exit 1
          fi

          echo "Tag format is valid and exists"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Check version is not older than latest
        if: needs.check-trigger.outputs.is_manual == 'true' && github.event.inputs.allow_older_version != 'true'
        run: |
          SELECTED_TAG="${{ needs.check-trigger.outputs.version_tag }}"
          LATEST_TAG=$(git describe --tags --abbrev=0)

          echo "Selected tag: $SELECTED_TAG"
          echo "Latest tag: $LATEST_TAG"

          # Extract version numbers (remove 'v' prefix)
          SELECTED_VERSION=${SELECTED_TAG#v}
          LATEST_VERSION=${LATEST_TAG#v}

          # Compare versions using sort -V (version sort)
          HIGHER_VERSION=$(printf "%s\n%s" "$SELECTED_VERSION" "$LATEST_VERSION" | sort -V -r | head -n1)

          if [ "$HIGHER_VERSION" != "$SELECTED_VERSION" ]; then
            echo "❌ Error: Selected tag $SELECTED_TAG is older than latest tag $LATEST_TAG"
            echo ""
            echo "To deploy an older version, you must:"
            echo "1. Re-run this workflow"
            echo "2. Check the 'Allow deploying an older version' checkbox"
            echo ""
            echo "⚠️  WARNING: Deploying older versions can cause data inconsistencies and rollback issues."
            exit 1
          elif [ "$SELECTED_TAG" == "$LATEST_TAG" ]; then
            echo "✅ Deploying latest version: $SELECTED_TAG"
          else
            echo "✅ Selected version $SELECTED_TAG is newer than latest $LATEST_TAG"
          fi

  deploy:
    needs: [check-trigger, validate-tag]
    if: needs.check-trigger.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create GitHub releases
    environment:
      name: prod
      url: https://intra.mik.fi
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-trigger.outputs.version_tag }}
          fetch-depth: 0

      - name: Check changed paths
        id: paths
        run: |
          backend_changed=false
          sql_changed=false

          # For manual deployment, check what changed in this tag compared to previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${{ needs.check-trigger.outputs.version_tag }}^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found - deploying all components"
            backend_changed=true
            sql_changed=true
          else
            echo "Comparing $PREVIOUS_TAG to ${{ needs.check-trigger.outputs.version_tag }}"
            CHANGED=$(git diff --name-only $PREVIOUS_TAG ${{ needs.check-trigger.outputs.version_tag }})
            echo "CHANGED=$CHANGED"

            while IFS= read -r path; do
              if [[ "$path" =~ ^apps/backend/ ]] || [[ "$path" == "Dockerfile" ]]; then
                backend_changed=true
              fi
              if [[ "$path" =~ ^sql/schema/ ]]; then
                sql_changed=true
              fi
            done <<< "$CHANGED"
          fi

          echo "backend_changed=$backend_changed" >> $GITHUB_ENV
          echo "sql_changed=$sql_changed" >> $GITHUB_ENV

      - name: Set repo name lowercase
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITAL_OCEAN_TEST_API_KEY }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Set environment variables
        run: |
          echo "DATABASE_URL=${{ secrets.POSTGRES_DO_URL_PRIVATE_PROD }}" >> $GITHUB_ENV
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD_PROD }}" >> $GITHUB_ENV
          echo "ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET_PROD }}" >> $GITHUB_ENV
          echo "MAGIC_LINK_SECRET=${{ secrets.MAGIC_LINK_SECRET_PROD }}" >> $GITHUB_ENV
          echo "REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET_PROD }}" >> $GITHUB_ENV
          echo "ACCESS_TOKEN_EXPIRATION=15 mins" >> $GITHUB_ENV
          echo "REFRESH_TOKEN_EXPIRATION=365 days" >> $GITHUB_ENV
          echo "SMTP_LOGIN=${{ vars.SMTP_LOGIN_PROD }}" >> $GITHUB_ENV
          echo "PUBLIC_URL=${{ vars.PUBLIC_URL_PROD }}" >> $GITHUB_ENV
          echo "VITE_API_TARGET=${{ vars.VITE_API_TARGET }}" >> $GITHUB_ENV
          echo "BETTERSTACK_API_TOKEN=${{ secrets.BETTERSTACK_API_TOKEN }}" >> $GITHUB_ENV
          echo "SIMPLBOOKS_OUTBOX_WORKER_ENABLED=${{ vars.SIMPLBOOKS_OUTBOX_WORKER_ENABLED_PROD }}" >> $GITHUB_ENV
          echo "SIMPLBOOKS_COMPANY_ID=${{ vars.SIMPLBOOKS_COMPANY_ID_PROD }}" >> $GITHUB_ENV
          echo "SIMPLBOOKS_BASE_URI=${{ vars.SIMPLBOOKS_BASE_URI_PROD }}" >> $GITHUB_ENV
          echo "SIMPLBOOKS_API_KEY=${{ secrets.SIMPLBOOKS_API_KEY_PROD }}" >> $GITHUB_ENV
          echo "SIMPLBOOKS_INVOICE_PAYMENT_WORKER_ENABLED=${{ vars.SIMPLBOOKS_INVOICE_PAYMENT_WORKER_ENABLED_PROD }}" >> $GITHUB_ENV
          echo "SIMPLBOOKS_INVOICE_PAYMENT_WORKER_RUN_ON_STARTUP=${{ vars.SIMPLBOOKS_INVOICE_PAYMENT_WORKER_RUN_ON_STARTUP_PROD }}" >> $GITHUB_ENV
          echo "OVERDUE_INVOICE_WORKER_ENABLED=${{ vars.OVERDUE_INVOICE_WORKER_ENABLED_PROD }}" >> $GITHUB_ENV
          echo "OVERDUE_INVOICE_WORKER_RUN_ON_STARTUP=${{ vars.OVERDUE_INVOICE_WORKER_RUN_ON_STARTUP_PROD }}" >> $GITHUB_ENV
          echo "OVERDUE_INVOICE_SUSPENSION_DAYS=${{ vars.OVERDUE_INVOICE_SUSPENSION_DAYS_PROD }}" >> $GITHUB_ENV
          echo "OCCURRENCE_NOTIFICATION_WORKER_ENABLED=${{ vars.OCCURRENCE_NOTIFICATION_WORKER_ENABLED_PROD }}" >> $GITHUB_ENV
          echo "DIGITAL_OCEAN_SPACES_KEY=${{ secrets.DIGITAL_OCEAN_SPACES_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "DIGITAL_OCEAN_SPACES_SECRET=${{ secrets.DIGITAL_OCEAN_SPACES_SECRET }}" >> $GITHUB_ENV
          echo "DIGITAL_OCEAN_SPACES_REGION=fra1" >> $GITHUB_ENV
          echo "DIGITAL_OCEAN_SPACES_ENDPOINT=https://fra1.digitaloceanspaces.com" >> $GITHUB_ENV
          echo "EQUIPMENT_FEE_DISCOUNT_PER_HOUR=${{ vars.EQUIPMENT_FEE_DISCOUNT_PER_HOUR }}" >> $GITHUB_ENV
          echo "CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS_PROD }}" >> $GITHUB_ENV
          echo "DO_MIK_VPC_UUID=${{ vars.DO_MIK_VPC_UUID }}" >> $GITHUB_ENV

      - name: Build and push Docker image
        if: env.backend_changed == 'true'
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
            registry.digitalocean.com/mik-ng2/${{ env.REPO_NAME }}:latest
            registry.digitalocean.com/mik-ng2/${{ env.REPO_NAME }}:${{ needs.validate-tag.outputs.tag_name }}

      - name: Get runner public IP
        if: env.sql_changed == 'true'
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          echo "Runner IP: $RUNNER_IP"

      - name: Add runner IP to database firewall
        if: env.sql_changed == 'true'
        run: |
          doctl databases firewalls append ${{ vars.DO_POSTGRES_CLUSTER_ID_FRA1 }} --rule ip_addr:${{ env.RUNNER_IP }}
          # Get the UUID of the rule we just added
          RULE_UUID=$(doctl databases firewalls list ${{ vars.DO_POSTGRES_CLUSTER_ID_FRA1 }} --output json | jq -r '.[] | select(.value == "${{ env.RUNNER_IP }}") | .uuid')
          echo "FIREWALL_RULE_UUID=$RULE_UUID" >> $GITHUB_ENV
          echo "Firewall rule UUID: $RULE_UUID"

      - name: Run Flyway migrations
        if: env.sql_changed == 'true'
        run: |
          docker run --network host --rm \
            -v ${{ github.workspace }}/sql/schema/migration:/flyway/sql \
            -v ${{ github.workspace }}/sql/migration_prod.conf:/flyway/conf/flyway.conf \
            -e FLYWAY_USER=${{ vars.DO_POSTGRES_ADMIN_USER }} \
            -e FLYWAY_PASSWORD=${{ secrets.DO_POSTGRES_ADMIN_PASSWORD}} \
            -e FLYWAY_URL=jdbc:postgresql://${{ vars.DO_POSTGRES_PUBLIC_URL_PROD}} \
            -e FLYWAY_PLACEHOLDER_REPLACEMENT=true \
            flyway/flyway:latest migrate

      - name: Run Flyway static data
        if: env.sql_changed == 'true'
        run: |
          docker run --network host --rm \
            -v ${{ github.workspace }}/sql/schema/static_data/:/flyway/sql \
            -v ${{ github.workspace }}/sql/staticdata_prod.conf:/flyway/conf/flyway.conf \
            -e FLYWAY_USER=${{ vars.DO_POSTGRES_ADMIN_USER }} \
            -e FLYWAY_PASSWORD=${{ secrets.DO_POSTGRES_ADMIN_PASSWORD }} \
            -e FLYWAY_URL=jdbc:postgresql://${{ vars.DO_POSTGRES_PUBLIC_URL_PROD}} \
            flyway/flyway:latest migrate

      - name: Remove runner IP from database firewall
        if: always() && env.sql_changed == 'true'
        run: |
          if [ -n "${{ env.FIREWALL_RULE_UUID }}" ]; then
            doctl databases firewalls remove ${{ vars.DO_POSTGRES_CLUSTER_ID_FRA1 }} --uuid ${{ env.FIREWALL_RULE_UUID }}
            echo "Removed firewall rule: ${{ env.FIREWALL_RULE_UUID }}"
          else
            echo "No firewall rule UUID found to remove"
          fi

      - name: Replace placeholders in mik-intranet.yaml
        run: |
          export DOMAIN=$(echo "${{ vars.PUBLIC_URL_PROD }}" | sed 's|https\?://||')
          envsubst < .do/mik-intranet-prod.yaml > .do/mik-intranet-prod.yaml.temp && mv .do/mik-intranet-prod.yaml.temp .do/mik-intranet-prod.yaml

      - name: Update app on DigitalOcean
        run: doctl apps update ${{ vars.DO_BACKEND_APP_ID_PROD }} --update-sources --spec .do/mik-intranet-prod.yaml --wait

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ needs.validate-tag.outputs.tag_name }}
          body: |
            ## Production Deployment - ${{ needs.validate-tag.outputs.tag_name }}

            This release has been deployed to production.

            ### Deployment Details
            - **Environment**: Production
            - **URL**: https://intra.mik.fi
            - **Tag**: ${{ needs.validate-tag.outputs.tag_name }}
            - **Deployed by**: ${{ github.actor }}
            - **Deployed at**: ${{ github.event.head_commit.timestamp }}

            ### Changes
            See commits and pull requests merged since the last release.
          draft: false
          prerelease: false
